structure:
  node_length: { min: 5, max: 95 }
  siblings: { min: 4, max: 10 }
  depth: { min: 5, max: 18 }
  single_child_collapse: true
  empty_nodes: false

style:
  prefer: nested
  shared_prefix_detection: true

content:
  tbd_allowed: true
  max_tbd_per_file: 5

references:
  mode: pointer
  back_pointers: true
  orphan_check: true
  duplicate_home_check: true
  max_pointer_hop: 1
  canonical_home_registry: true

vocabulary:
  banned_bare: [env, frame, session, trust, budget, surface, route, tier, plugin, verb, namespace]
  required_qualifiers:
    env: [environment, process env, CliEnvelope]
    frame: [budget frame, call frame, federated frame]
    session: [harness session, kernel session]
    trust: [trust rung, trust receipt, trust floor]
    budget: [fuel budget, spend ceiling, frame budget]
    surface: [CLI surface, extension surface]
    route: [network route, dispatch route]
    tier: [platform tier, trust rung]
    plugin: [plugin process, plugin manifest, plugin installation, plugin verb, plugin table, plugin id, plugin surface]
    verb: [plugin verb, routine, API verb]
    namespace: [ctx namespace, CLI noun]
  synonyms:
    - [postgres, postgresql, pg]
    - [auth, authentication, sign-in, signin]
    - [api, endpoint, route]
    - [frontend, client, ui]
    - [db, database, storage]
    - [capability, action, verb]
    - [environment, env, world]
    - [routine, procedure, script]
    - [spec, cans, outline]
    - [trust rung, trust level, trust tier]
    - [platform tier, OS tier]
    - [execution governor, budget governor]

canonical_homes:
  exit_codes: kernel.md#Exit-code-law
  five_concerns: kernel.md#The-5-concerns
  four_laws: kernel.md#The-4-physical-laws
  sql_layers: kernel.md#Layer-1-C-authorizer
  three_phase_engine: kernel.md#Unified-3-phase-engine
  policy_governance_split: kernel.md#Policy-vs-governance-split
  trust_ladder: governance.md#The-ladder
  budget_frames: governance.md#Budget-frames
  fuel_formula: governance.md#Fuel-formula
  promotion: governance.md#Promotion-gates
  vault: egress.md#Vault-proxy
  wire_scrubber: egress.md#Wire-scrubber
  quota: egress.md#Quotas
  platform_tiers: sandbox.md#Platform-tiers
  ipc_stdio: sandbox.md#Channel-A
  ipc_ring: sandbox.md#Channel-B
  fast_path: governor.md#Fast-path
  yield_path: governor.md#Yield-path
  outbox_inbox: world.md#Outbox-inbox
  causal_dag: effect.md#Causal-DAG
  audit_spine: effect.md#Audit-spine
  claims_lease: world.md#Claims-lease
  concurrency: identity.md#Concurrency
  harness_markers: identity.md#Harness-markers
  env_vars: identity.md#Environment-variables
  dual_schema: world.md#Dual-schema
  system_schema_roster: world.md#System-schema-roster
  plugin_schema_namespace: world.md#Plugin-schema-namespace
  migration: world.md#Migration
  snapshots: world.md#Snapshots
  denials: effect.md#Denials
  decay: lifecycle.md#Decay
  environments: lifecycle.md#Environments
  masking: lifecycle.md#Masking
  plugin_manifest: plugins.md#Manifest
  plugin_capabilities: plugins.md#Capabilities
  cli_noun_registration: plugins.md#CLI-noun-registration
  ctx_namespace_registration: plugins.md#Ctx-namespace-registration
  schema_extension: plugins.md#Schema-extension
  generations: plugins.md#Generations
  federation_transport: plugins.md#Federation-transport
  pack_taxonomy: marketplace.md#Pack-taxonomy
  pack_format: marketplace.md#Packs
  registry: marketplace.md#Registry
  cli_surface: interface.md#CLI-surface
  kernel_nouns: interface.md#The-9-kernel-nouns
  plugin_nouns: interface.md#Plugin-provided-nouns
  client_rpc: interface.md#Client-RPC-contract
  onboarding: interface.md#Onboarding
  monorepo: assembly.md#Monorepo-layout
  cicd: assembly.md#CICD
  pack_distribution: overview.md#The-pack-distribution-model
  test_plan: artifacts/test-plan/manifest.yaml
  test_plan_laws: artifacts/test-plan/matrix.yaml#anti_slop_laws
  test_plan_matrix: artifacts/test-plan/matrix.yaml#confusion_matrix
  test_plan_schema: artifacts/test-plan/test-plan-structure.md

token_budget:
  enabled: true
  default_limit: 4096
  estimate_chars_per_token: 3.5
  warn_threshold: 0.8

redundancy:
  word_frequency_threshold: 12
  phrase_overlap_threshold: 0.7
  cross_file_threshold: 2
  stopwords: [the, a, an, of, to, in, for, and, or, with, must, shall, requires, capcli, kernel, agent, agents, routine, routines, policy, governance, audit, capability, capabilities, budget, trust, world, frame, frames, env, environment, prod, sim, stage, gate, gates, spec, session, intent, human, yaml, schema, write, writes, read, reads, node, nodes, file, files]

overflow:
  max_node_chars: 95
  force_file_for: [code_block, table, diagram]