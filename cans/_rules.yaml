# Day-1 shape rules — capcli cans (plugin-first rewrite, 2026-10-13)
# A node is a bullet plus its descendant bullets. node_length counts lines per node.

structure:
  node_length: { min: 5, max: 95 }
  siblings: { min: 4, max: 10 }
  depth: { min: 5, max: 18 }
  single_child_collapse: true
  empty_nodes: false
  # Sibling minimum binds structural levels (d1 + d2). Honest d3+ clusters of
  # 2-3 children are acceptable without markers (verified unpadded by scan).
  # Small chapters (<50 lines) may carry honest 2-3-child d2 groupings without
  # exception markers; the marker requirement binds chapters large enough that
  # thin structure is a choice, not a necessity.
  # A proven-binary concept (no deeper facets exist after depth exploration) carries an explicit exception marker:
  # - exception: binary — <one-line proof>
  # Lowering the bar is not the fix; going deeper is.
  # Depth minimum is a tree-wide target. A chapter whose row count cannot
  # honestly fill depth 5 carries an explicit marker instead of padded depth:
  # - exception: shallow — <row count> rows; max honest depth <N>
  # Padding to hit depth is invention; the marker is honesty.

style:
  prefer: nested  # nested = prefer depth over siblings (checker vocabulary)
  shared_prefix_detection: true

content:
  tbd_allowed: true
  max_tbd_per_file: 3

references:
  mode: pointer
  back_pointers: true
  orphan_check: true
  duplicate_home_check: true

redundancy:
  enabled: true
  word_frequency_threshold: 12
  phrase_overlap_threshold: 0.7
  cross_file_threshold: 2
  stopwords: [the, a, an, of, to, in, for, and, or, with, must, shall, requires, capcli, kernel, microkernel, agent, agents, routine, routines, policy, governance, audit, capability, capabilities, budget, trust, world, frame, frames, env, environment, prod, sim, stage, gate, gates, spec, session, intent, human, yaml, schema, write, writes, read, reads, node, nodes, file, files, plugin, plugins, verb, verbs, manifest, manifests, tri-jail, generation, generations, pack, packs, layer, layers, hook, hooks, trigger, triggers, template, templates, urp, urps, fuel, vault, egress]
  synonyms:
    - [postgres, postgresql, pg]
    - [auth, authentication, sign-in, signin]
    - [api, endpoint, route]
    - [frontend, client, ui]
    - [db, database, storage]
    - [capability, action, verb]
    - [environment, env, world]
    - [routine, procedure, script]
    - [spec, cans, outline]
    - [write, writes, writing, written]
    - [read, reads, reading]
    - [list, lists, listed, listing]
    - [appear, appears, appeared]
    - [queue, queues, queued]
    - [revert, reverts, reverted]
    - [populate, populates, populated]
    - [preserve, preserves, preserved]
    - [draft, drafts, drafted]
    - [stay, stays, stayed]
    - [grant, grants, granted]
    - [scaffold, scaffolds, scaffolded]
    - [cost, costs, costed]
    - [fork, forks, forked]
    - [mark, marks, marked]
    - [end, ends, ending, ended]
    - [feed, feeds, feeding]
    - [sync, syncs, synced]
    - [promote, promotes, promoted]
    - [deny, denies, denied]
    - [allow, allows, allowed]
    - [trust, trusted, trusting]

token_budget:
  enabled: true
  default_limit: 4096
  estimate_chars_per_token: 3.5
  warn_threshold: 0.8

overflow:
  max_node_chars: 200
  force_file_for: [code_block, table, diagram]
