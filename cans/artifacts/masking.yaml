# ═══════════════════════════════════════════════════════════════
# masking.yaml — Format-Preserving Anonymization (FPA) SSOT
# Pointers: policy://masking/*
# ═══════════════════════════════════════════════════════════════
version: 1
enforcement: strict

rules:
  email:
    pointer: "policy://masking/email"
    matcher: "^[^@]+@[^@]+\\.[^@]+$"
    generator: "fpa_email"
    template: "anon_{hash8}@sim.local"
  phone:
    pointer: "policy://masking/phone"
    matcher: "^\\+?[1-9]\\d{1,14}$"
    generator: "fpa_phone"
    template: "+1555{hash4}"
  json_secret:
    pointer: "policy://masking/json_secret"
    keys: ["*token*", "*secret*", "*password*", "*key*"]
    replacement: "[REDACTED_VAULT_TOKEN]"
  generic_text:
    pointer: "policy://masking/generic_text"
    generator: "fpa_lorem_hash"
    preserve_length: true

  # audit redaction rules (moved byte-for-byte from policy.yaml#audit.redact)
  redact:
    columns: [secrets.value]
    params_matching: ["*token*", "*password*", "*secret*"]
    auth_headers: always
