$schema: "test-plan/case/v1"
case_id: "bc_13_inspect_preflight_can_invoke_verdict"
title: "Inspect pre-flight returns can_invoke_now: false with the tightest constraint on depleted session fuel"
domain: "budget_cascade"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Pre-flight"
  statement: "'budget_status.can_invoke_now is the pre-flight verdict; false + blocking_reasons -> don't call' (budget.md#Cascade-view-in-`inspect`: 'invocation verdict — can_invoke_now boolean returned'; 'tightest_constraint names the first blocking pillar'; 'denial reasons — blocking_reasons details exact failing constraints'; assembly.md#Core-domain-subsystems preflight.rs 'evaluates can_invoke_now verdict'): against a session with zero fuel headroom the verdict is exactly false and the tightest blocking pillar is named."
  blast_radius_if_breached: "A pre-flight that answers can_invoke_now: true on zero headroom would green-light dispatches that then die mid-DAG with exit 2 — wasted fuel, half-planned agent reasoning, and thrashing alert storms (20 sustained denials) across every enterprise session at its fuel ceiling."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting only exit 0 of the inspect command (the command 'succeeded') while ignoring the verdict field — the engine returning can_invoke_now: true at zero headroom (the actual bug) would pass the test."
  anti_slop_mitigation: "AS-03 forces parsing of the CliEnvelope data block: budget_status.can_invoke_now == false exactly, tightest_constraint == 'session_fuel', blocking_reasons non-empty — the verdict is the assertion, not the exit code. AS-06 pins the literal headroom 0 of 100000. AS-02 proves the read-only inspect mutated nothing."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_bc_13"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_budget_frames"
        row_count: 1   # session frame with consumed_fuel 100000 of the 100000 session fuel pool — zero headroom
      - name: "_api_quota"
        row_count: 1   # provider 'threads': healthy quota (28 available) — fuel is the sole blocking pillar
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: 'preflight evaluation via capcli-core::run::preflight (assembly.md#Core-domain-subsystems preflight.rs) for routine cap://sync_orders@5 against the depleted session — the same evaluation the CLI renders via `capcli inspect cap://sync_orders@5`'
  input_params:
    routine: "sync_orders@5"
    session_fuel_remaining: 0
    session_fuel_ceiling: 100000
    fuel_declared: 50   # routine_min_fuel = fuel_declared
    quota_remaining: 28

expected_observations:
  exit_code: 0   # the inspect command itself succeeds — the DENIAL is carried in the data verdict, not the exit code
  state_modified: false
  diagnostic:
    domain: "run.preflight"
    culprit: "tightest constraint: session_fuel — 0 of 100000 session fuel remaining (headroom is zero); the PreflightEnvelope reports fuel_declared, session_fuel_remaining, cadence_status, ceiling_status, can_invoke_now"
    remedy: "free session fuel (chunk the work, close child frames, or start a new session) before invoking; false + blocking_reasons means don't call"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "capability.inspect"   # NOTE: inspect event name not located verbatim in cans/ effect.md payload list; grounded in effect.md#Event-integrity ('zero ghost actions — 100% of CLI verbs ... advance the hash chain') and action.md#Inspect-format (single JSON payload) — channel.verb naming applied
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _budget_frames and _api_quota identical before/after (strict equality) and the frame row's consumed_fuel still reads exactly 100000 — the pre-flight evaluation is read-only and pushes no frame, burns no fuel, debits no token."
  - rule: "AS-03"
    verification: "Parse the CliEnvelope data block (not just exit_code == 0): budget_status.can_invoke_now == false exactly, tightest_constraint == 'session_fuel', blocking_reasons is a non-empty array naming the fuel constraint, and the envelope carries all five PreflightEnvelope fields — a true verdict or missing fields fail the test."
  - rule: "AS-06"
    verification: "Hardcoded literals: session_fuel_remaining == 0, ceiling == 100000, quota_remaining == 28 (healthy — proving the tightest-constraint picker selected fuel, not quota); the expected verdict false is an immutable literal, never derived from re-running the preflight."
