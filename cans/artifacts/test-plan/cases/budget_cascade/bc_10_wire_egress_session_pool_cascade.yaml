$schema: "test-plan/case/v1"
case_id: "bc_10_wire_egress_session_pool_cascade"
title: "Session fuel pool exhausted by wire egress across child routines blocks the next API call"
domain: "budget_cascade"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Fuel-formula"
  statement: "'1 KB wire egress = 5 fuel' — wire egress is fuel, burned against the single session fuel pool; no bypass via splitting: sibling child routines A (10240 KB = 51200 fuel) and B (9760 KB = 48800 fuel) together exhaust the 100000-fuel session pool, so child C's subsequent API call is blocked pre-dispatch (budget_exhaustion: deny, exit 2)."
  blast_radius_if_breached: "If wire egress were scoped per routine instead of converted to session fuel, an agent could split a bulk-export workload into child frames and each would get a fresh allowance — exfiltrating unbounded data volume through the egress boundary under the radar of any single ceiling."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by resetting the fuel counter at each child frame push (mirroring the per-routine scoping bug) and asserting each child's own allowance — the session-level fuel exhaustion is never actually produced."
  anti_slop_mitigation: "AS-06 pins the accumulation literals (51200 + 48800 = 100000 across two children, not two independent pools) and the blocked third call. AS-02 proves the session consumed_fuel is unchanged by the denied call. AS-03 forces the typed exit 2 citing the session-level fuel pool, not a per-routine counter."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_bc_10"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_budget_frames"
        row_count: 3   # session root frame + child A + child B; session consumed_fuel = 100000 of 100000
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: 'ctx.api.call("threads.posts", params={"text": "digest"}, intent="third child dispatch") attempted by child routine C after the session fuel pool (100000) was fully burned by sibling child routines A (10240 KB egress = 51200 fuel) and B (9760 KB egress = 48800 fuel)'
  input_params:
    session_fuel_ceiling: 100000
    burned_by_child_a_fuel: 51200   # 10240 KB x 5 fuel/KB
    burned_by_child_b_fuel: 48800   # 9760 KB x 5 fuel/KB
    attempted_call: "threads.posts"

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.budget"
    culprit: "session fuel pool exhausted: 100000/100000 fuel burned across multiple child routines (one pool per session — wire egress converts at 5 fuel/KB, no bypass via splitting); the subsequent API call is blocked pre-dispatch"
    remedy: "redistribute the wire volume across sessions or shrink payloads — egress fuel is session-scoped, not per-routine, so splitting into child frames grants no fresh allowance"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "budget.exhausted (pillar: fuel)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT on the session's frame rows: consumed_fuel still reads exactly 100000 after the denied call (the blocked dispatch debited 0 fuel) and no business table row counts changed."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 2 and parse the CliEnvelope diagnostic: domain == 'policy.budget' and the citation names the SESSION-level fuel pool (budget_denial_cites_level), never a per-routine counter — a per-routine framing in the diagnostic fails the test."
  - rule: "AS-06"
    verification: "Hardcoded literals: child A burned 51200 + child B burned 48800 = session total 100000 (single accumulation, verified by direct read of both child frame rows); the third call is blocked — expected values are immutable literals, never derived from the engine's counters."
