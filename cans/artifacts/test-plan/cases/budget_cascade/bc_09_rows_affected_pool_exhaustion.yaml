$schema: "test-plan/case/v1"
case_id: "bc_09_rows_affected_pool_exhaustion"
title: "150-row batch write (1500 fuel) aborts the whole transaction at the 1000-fuel frame envelope"
domain: "budget_cascade"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Fuel-formula"
  statement: "'1 DB row written = 10 fuel' — row writes are fuel costs, not a separate pool: a batch write attempting 150 rows costs 1500 fuel against the frame's 1000-fuel envelope, so the kernel aborts the whole transaction with exit 2 — 'no partial execution past budget', neither the first 100 rows nor the remaining 50 are committed."
  blast_radius_if_breached: "Committing the first 100 rows and discarding the last 50 (or vice versa) would leave half-aligned business state — orders marked aligned in one warehouse but not its twin, a silent integrity split discovered only by downstream reconciliation jobs."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting the denial but only checking the row count of a *different* table, or by trusting the routine's own reported rows_affected instead of physically re-querying the mutated table — a partial commit of 100 rows would pass unnoticed."
  anti_slop_mitigation: "AS-02 mandates the direct before/after SELECT count(*) plus a field-level check (no row carries the batch's new status) — exactly 0 of 150 rows may be committed. AS-03 forces the typed exit 2 with measured 1500 fuel vs 1000 envelope cited. AS-06 pins the literals 150/1500/1000/0."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_bc_09"
    trust: "reviewed"
  initial_state:
    schema_yaml: |
      tables:
        - name: orders
          columns:
            id: "int~"
            status: "text"
            warehouse: "text"
    tables:
      - name: "orders"
        row_count: 500   # 500 existing rows; the batch targets 150 rows in warehouse 'west'
      - name: "_budget_frames"
        row_count: 1   # frame with a 1000-fuel envelope
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: 'capcli run cap://bulk_status_update@2 -p warehouse=west -p batch=150 -m "align west warehouse status" (routine wraps a 150-row UPDATE inside `with ctx.db.txn():`)'
  input_params:
    rows_attempted: 150
    fuel_per_row_written: 10
    fuel_cost: 1500   # 150 rows x 10 fuel
    frame_fuel_envelope: 1000
    trust_level: "reviewed"

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.budget"
    culprit: "frame fuel exhausted: bulk_status_update@2 attempted a 150-row write costing 1500 fuel against the 1000-fuel frame envelope (1 row written = 10 fuel); the whole transaction is aborted"
    remedy: "chunk the write into transactions that fit the frame fuel envelope, or declare a larger fuel envelope — the first 100 rows are NOT committed and the remaining 50 are NOT silently discarded"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "budget.exhausted (pillar: fuel)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM orders returns 500 before and after (strict equality) AND zero rows carry the batch's new status value — proving exactly 0 of the 150 attempted rows were committed, not 100 committed plus 50 discarded."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 2 and parse the CliEnvelope diagnostic: domain == 'policy.budget', the denial cites the measured cost (1500 fuel) against the envelope (1000) per cite_measured_value, and the transaction-abort remedy is present."
  - rule: "AS-06"
    verification: "Hardcoded literals: attempted 150 rows, fuel cost 1500, envelope 1000, committed 0 — the expected commit count is an immutable literal verified by direct SQL, never taken from the engine's reported rows_affected."
