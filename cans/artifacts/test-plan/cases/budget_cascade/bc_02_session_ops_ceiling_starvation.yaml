$schema: "test-plan/case/v1"
case_id: "bc_02_session_ops_ceiling_starvation"
title: "Session fuel pool starvation: the 11th child invocation dies with exit 2 after the session fuel pool saturates"
domain: "budget_cascade"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Splitting-is-not-escaping"
  statement: "'Session-level fuel counters never reset through composition' — the 100000-fuel session pool survives subdivision: 11 invocations of 5 fuel still saturate the session fuel pool: once the session total is consumed, the next child invocation is denied with exit 2 (budget_exhaustion: deny — never silent truncation)."
  blast_radius_if_breached: "If session fuel counters reset across child frame pushes, any agent could subdivide a banned workload into child routines and execute unbounded fuel inside one session — silently consuming shared compute and starving every other enterprise session on the host."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by resetting session fuel counters between child pushes in the fixture (or spawning a fresh session per child), so the 11th call succeeds and the 'starvation' denial is never actually produced by the kernel."
  anti_slop_mitigation: "AS-02 proves via direct SQL that session fuel consumption persisted at the cap across all ten child frame pushes and that the 11th invocation mutated nothing. AS-03 forces the typed exit 2 with the diagnostic citing session remaining 0 and ancestors. AS-06 pins the literals (100000 pool, 99950 pre-consumed, 5 fuel per child, 11th call index)."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_bc_02"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_budget_frames"
        row_count: 1   # parent orchestrator frame fanout_sync@2; session already consumed 99950 of 100000 session fuel
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: 'capcli run cap://fanout_sync@2 -p children=11 -m "fan-out child sync batch" — the parent attempts 11 child routine invocations; children 1-10 each burn 5 fuel, the 11th is invoked last'
  input_params:
    children_attempted: 11
    child_fuel_each: 5
    session_consumed_before: 99950
    session_fuel_ceiling: 100000   # policy.yaml#api.fuel.per_session_fuel

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.budget"
    culprit: "session fuel pool exhausted: fanout_sync@2's 11th child invocation denied at session 100000/100000 fuel — session-level counters never reset through composition (splitting is not escaping)"
    remedy: "shrink the fan-out or continue in a new session; wrapping the workload in more child frames cannot reset the session fuel pool"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "budget.exhausted"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) on every business table before/after is identical (the children are read-only, the 11th committed nothing); the session consumed_fuel reads exactly 100000/100000 after the run — proving fuel accumulated across all ten successful child frame pushes and was never reset."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 2 and parse the CliEnvelope diagnostic: domain == 'policy.budget', the denial cites the session level (budget_denial_cites_level), the measured 100000/100000 consumed, and the ancestor context line 'session remaining: 0 fuel' (budget_denial_cites_ancestors)."
  - rule: "AS-06"
    verification: "Hardcoded literals: pool 100000, pre-consumed 99950, 5 fuel per child, denial at the 11th invocation — the expected denied index is a literal, never derived from counting the engine's own frame rows."
