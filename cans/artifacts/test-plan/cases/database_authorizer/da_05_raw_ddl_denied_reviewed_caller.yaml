$schema: "test-plan/case/v1"
case_id: "da_05_raw_ddl_denied_reviewed_caller"
title: "Raw ALTER TABLE issued by a reviewed-trust caller is denied at the C authorizer (exit 2); the revision pipeline is the sole DDL path"
domain: "database_authorizer"
target_tier: "e2e"
target_crate: "crates/capcli-cli"
invariant:
  law_reference: "cans/physics.md#ddl-trust-floors"
  statement: "Raw DDL (ALTER/DROP/CREATE TABLE) is denied at the C authorizer for draft AND reviewed principals; denial exits 2. Trust cannot purchase raw schema execution - the kernel 4-phase revision pipeline is the sole legal DDL path (see world.md#Four-phase-state-revision-pipeline)."
  blast_radius_if_breached: "A reviewed principal landing raw ALTER directly in live tables bypasses the Expand/Align/Contract/Pin pipeline: no lock-timing SLA, no align chunking, no shadow-table delta replication, no PRAGMA pin check - long-lived prepared statements, views, and triggers shaped against the old schema silently read wrong columns at fleet scale."
confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent runs the test in dev with a pinned trust pre-configured in the session, so the ALTER succeeds and the reviewed-denial path is never exercised."
  anti_slop_mitigation: "AS-03 requires the typed exit code plus an authorizer-domain diagnostic; AS-02 proves orders row count and PRAGMA column list are byte-identical; setup pins caller trust to reviewed and the slop risk is explicitly listed as banned fixture configuration."
setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "harness.schema-tinkerer@acme.corp"
    agent_id: "agt_da_05"
    trust: "reviewed"
  initial_state:
    schema_yaml: |
      version: 12
      engine: sqlite
      db: workspace.db
      tables:
        orders:
          description: "Transactional order root with discount integrity trigger"
          prov: true
          columns:
            id: pk
            ref: text!
            customer_id: int ref=customers.id
            total_cents: int=0
            status: text=pending
    tables:
      - name: "orders"
        row_count: 500
    vault_secrets: []
execution:
  trigger: "cli_subcommand"
  command: "capcli sql \"ALTER TABLE orders ADD COLUMN rush boolean\" -m \"add rush flag\""
  input_params:
    ddl_action: "alter"
    caller_trust: "reviewed"
    denial_basis: "raw DDL denied for draft and reviewed principals alike"
expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.authorizer"
    culprit: "ALTER TABLE orders ADD COLUMN rush boolean issued by trust=reviewed caller; raw DDL denied at the C authorizer for draft and reviewed principals (authorizer.global.alter: deny)"
    remedy: "Use the kernel revision pipeline: declare the column in schema.yaml, rule plan --name add_rush_flag, rule prove <id> --env sim, then rule apply <id>."
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "db.exec (decision: denied, effect: none)"
    chain_valid: true
    state_modified_field: false
anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM orders == 500 before and after; PRAGMA table_info(orders) column list identical before and after (no 'rush' column materialized) - schema drift is a state mutation and must be proven absent."
  - rule: "AS-03"
    verification: "Assert exit_code == 2 (integer) and parse the --json CliEnvelope: diagnostic.domain == 'policy.authorizer', culprit cites the authorizer denial of raw DDL for a reviewed caller, remedy names the revision pipeline path."
  - rule: "AS-01"
    verification: "Static lint: no mock on crates/capcli-core/src/db/authorizer.rs; the session trust rung must be pinned to reviewed in setup and never upgraded mid-test."
