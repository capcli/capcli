$schema: "test-plan/case/v1"
case_id: "bt_11_ask_options_count_ceiling"
title: "ctx.ping.ask with 6 response options proceeds with exit 0 and a lint advisory: option counts past max_options are guidance, not a denial"
domain: "bindings_triggers"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Output-caps" # ask option guidance; lint tier: cans/physics.md#Exit-code-law
  statement: "The ask option count is lint-tier guidance (max_options: 5, artifacts/governance.yaml#notify.ask): supplying 6 response options proceeds with exit 0, creates the _pending_asks suspension row with all 6 options stored, and carries a lint advisory on the ask envelope under lint_findings. Structured options stay mandatory (artifacts/policy.yaml#notify.ask: structured_options_required); the lint tier never denies, never blocks, never gates execution."
  blast_radius_if_breached: "Treating option counts as a kernel denial strands legitimate multi-choice decisions (6 carriers, 7 regions) with no lawful path forward; treating them as unbounded removes the nudge toward readable one-card decisions entirely — the lint advisory is the middle path."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent hard-denies the 6-option ask with exit 2 (the old law), or silently truncates the options array to 5 and asserts success, or mutates governance.yaml max_options upward; or asserts the suspension without proving the lint advisory rides the envelope."
  anti_slop_mitigation: "AS-06 pins the immutable literal pair (6 supplied vs 5 guidance) plus a 5-option at-cap companion carrying no advisory; AS-02 proves the suspension row exists with all 6 options stored via direct SELECT on _pending_asks; AS-03 requires exit_code == 0 with lint_findings on the envelope naming the option-count guidance."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com" # ask target principal
    agent_id: "agt_bt_11"
    trust: "reviewed" # route_shipment@1 calls ctx.ping.ask mid-execution
  initial_state:
    schema_yaml: null
    tables:
      - name: "_pending_asks"
        row_count: 0 # the 6-option ask creates its suspension row; option counts are lint guidance, not a gate
      - name: "_audit"
        row_count: 2 # routine.draft + prove events for route_shipment@1
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: 'ctx.ping.ask(principal="human.oncall@example.com", question="Which carrier for ORD-10?", options=["usps", "ups", "fedex", "dhl", "royal", "gls"], timeout_minutes=60)'
  input_params:
    routine: "route_shipment@1"
    ask_principal: "human.oncall@example.com"
    ask_question: "Which carrier for ORD-10?"
    options_supplied: 6
    max_options: 5 # artifacts/governance.yaml#notify.ask
    options_list: ["usps", "ups", "fedex", "dhl", "royal", "gls"]
    timeout_minutes: 60

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "ping.ask"
    culprit: "6 response options supplied against the max_options: 5 guidance (artifacts/governance.yaml#notify.ask); lint advisory recorded — the ask proceeds and suspends normally"
    remedy: "no action required; consider folding the list to 5 structured choices or a follow-up ask for readability"
    lint_findings:
      - "ask.options_count: 6 supplied vs max_options 5 guidance — advisory only, execution unaffected: see cans/physics.md#Exit-code-law"
  database:
    row_count_delta: 2   # the _pending_asks suspension row (all 6 options stored) + the suspension audit event
    tables_mutated: ["_pending_asks", "_audit"]
  wire:
    packets_transmitted: 0 # suspension parks locally; the Cockpit card dispatches on the notify channel
    syscall_42_trapped: false
  audit:
    event_emitted: "ask.suspended" # NOTE: ask-suspension event verb not located in cans/effect.md payload list; the _pending_asks row is the ground truth, chain_valid per the zero-ghost-actions law
    chain_valid: true
    state_modified_field: true

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _pending_asks before and after the 6-option ctx.ping.ask; assert the delta is exactly +1, and SELECT options FROM _pending_asks reads all 6 literals [usps, ups, fedex, dhl, royal, gls] — no truncation, no gate."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 0 and parse the CliEnvelope: envelope.lint_findings contains the ask.options_count advisory citing 6 vs the max_options: 5 guidance; envelope.state_modified == true; no denial diagnostic present."
  - rule: "AS-06"
    verification: "The boundary pair (6 supplied, 5 guidance) is hardcoded in the test spec with a 5-option at-cap companion suspension carrying zero lint findings — the advisory fires only past the guidance boundary, never at it; the fixture governance.yaml must remain unmodified (compiles into capcli.lock)."
