$schema: "test-plan/case/v1"
case_id: "vs_05_draft_routine_secret_read_denial"
title: "Draft-trust routine attempting to read a live vault credential is halted at the policy gate with exit 2 — even in the dev environment"
domain: "vault_secrets"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/agent.md#trust-restriction-—-draft-routines-denied-secret-access"
  statement: "Draft routines are denied secret access: the draft rung's can_read.secrets is false and the authorizer's secrets table rule carries deny_for_trust: [draft], so a draft-trust routine invoking a credential-backed egress is halted at the policy gate with exit 2 before the ciphertext is ever decrypted — the floor holds in the dev environment exactly as in prod."
  blast_radius_if_breached: "Unproven exploratory code reads live production credentials: a draft routine (full payload audit but zero sim proof) can exfiltrate sk_live keys via its sandboxed socket path or embed them in unreviewed output — the vault becomes a credential vending machine for unreviewed code."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent runs the draft routine only in prod (where the prod trust floor would deny anyway) instead of dev, or pre-promotes the fixture routine to reviewed, or mocks the authorizer callback to return SQLITE_OK so the read succeeds (catalog banned slop: granting draft routines access to live credentials in dev environment)."
  anti_slop_mitigation: "AS-01 forbids mocking the authorizer or the vault — the real deny_for_trust rule fires; AS-02 proves the secret row is untouched and the ciphertext was never decrypted (zero key-usage); AS-03 forces the typed exit 2 with the policy.trust domain in the dev environment."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "user:dana"
    agent_id: "agt_vs_05"
    trust: "draft"
  initial_state:
    schema_yaml: null
    tables:
      - name: "secrets"
        row_count: 1
      - name: "routines"
        row_count: 1
      - name: "_audit"
        row_count: 4
    vault_secrets:
      - ref: "vault://stripe_key"
        scope: "dev"

execution:
  trigger: "cli_subcommand"
  command: "capcli run cap://pay@1 -p charge_id=ch_9d21K -m \"first charge attempt from draft routine\""
  input_params:
    charge_id: "ch_9d21K"
    requested_secret_ref: "vault://stripe_key"
    routine_trust: "draft"

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.trust"
    culprit: "draft routine pay@1 denied secret access: trust.draft can_read.secrets = false and the authorizer's deny_for_trust blocks the secrets read for draft callers"
    remedy: "prove and ship the routine to reviewed trust ('capcli routine prove pay --env sim' then ship), or rehearse against schema-validated mock fixtures in sim without live credentials"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "routine.run (decision: denied, effect: none; rule policy.trust.secrets_floor)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-01"
    verification: "The denial comes from the real authorizer rule (secrets deny_for_trust: [draft]) evaluated by the live engine — no mockall or manual mock on the authorizer callback, no stubbed vault; a reviewed-trust control invocation on the identical fixture must reach the pre-call secret resolution, proving the floor is trust-conditional, not fixture-conditional."
  - rule: "AS-02"
    verification: "Post-denial substrate proof on envs/dev/workspace.db: SELECT count(*) FROM secrets returns 1 with the value column byte-identical to the pre-command read (ciphertext unchanged), and the kernel key-usage telemetry for 'vault://stripe_key' shows 0 decrypt operations during the denied run — the ciphertext was never opened."
  - rule: "AS-03"
    verification: "Parse the --json CliEnvelope: exit_code == 2 (policy gate, not the exit 3 missing-secret path — the secret exists), state_modified == false, diagnostic.domain == 'policy.trust', diagnostic.culprit cites the draft secrets floor; stdout prefix '[dev:tier_1]' proves the dev environment did not relax the floor."
