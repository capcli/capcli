$schema: "test-plan/case/v1"
case_id: "vs_11_secret_rotation_in_memory_eviction"
title: "Vault rotation of stripe_key evicts the daemon's in-memory decrypted cache instantly — a warm daemon's next egress dispatch uses the new credential, not the stale one"
domain: "vault_secrets"
target_tier: "integration"
target_crate: "crates/capcli-daemon"

invariant:
  law_reference: "cans/agent.md#auto-refresh-—-daemon-auto-rotates-tokens-in-memory;-stateless-CLI-decrypts-root,-rotates,-and-commits-updated-ciphertext"
  statement: "Secret rotation commits updated ciphertext to the vault and the daemon's in-memory decrypted cache is evicted at the same instant: a warm daemon holding the pre-rotation decrypted value must serve the next egress dispatch with the rotated credential only — no stale plaintext survives in process memory and no daemon restart is involved (the cache eviction is in-place, per the daemon's memory-encrypted cache contract)."
  blast_radius_if_breached: "A rotated-but-compromised credential stays live: the daemon keeps authorizing payment traffic with the old key indefinitely (revocation ineffective), and the stale plaintext lingers in heap memory after rotation — the exact window an attacker reuses the retired credential."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent restarts the daemon between rotation and probe (cold start trivially loads the new value — the eviction path is never exercised), or mocks the in-memory cache so the stale value never existed, or asserts the new ciphertext row without ever dispatching through the warm daemon (catalog banned slop: retaining stale decrypted secrets in daemon process memory)."
  anti_slop_mitigation: "AS-01 forbids mocking the daemon vault or cache — the warm daemon path must run for real; AS-06 hardcodes the raw-memory stale-token scan (0 occurrences post-rotation) and the new-credential header hash on the probe dispatch; AS-05 verifies the vault.set rotation event and ciphertext change."

setup:
  env: "prod"
  platform_tier: "tier_1"
  caller_identity:
    principal: "user:maya"
    agent_id: "agt_vs_11"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "secrets"
        row_count: 1
      - name: "_audit"
        row_count: 4
    vault_secrets:
      - ref: "vault://stripe_key"
        scope: "prod"

execution:
  trigger: "cli_subcommand"
  command: "printf '%s' \"sk_live_VS11_ROTATED_3d7f\" | capcli sys vault set vault://stripe_key --scope prod --in @-"
  input_params:
    secret_ref: "vault://stripe_key"
    scope: "prod"
    pre_rotation_plaintext: "sk_live_VS11_OLD_2b8e"
    rotated_value_literal: "sk_live_VS11_ROTATED_3d7f"
    post_rotation_probe: "warm-daemon egress dispatch via ctx.api.call(\"stripe.charges\") — the daemon process is NOT restarted between rotation and probe"
    expected_sha256_rotated: "13dd9cf1f684d527bbf9aafd8c7c4d460c2e8f406acaaf94e31ea09b415f71b3"

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: null
    culprit: null
    remedy: null
  database:
    row_count_delta: 1
    tables_mutated:
      - "secrets"
      - "_audit"
  wire:
    packets_transmitted: 1
    syscall_42_trapped: false
  audit:
    event_emitted: "vault.set (secret_name: stripe_key, secret_hash_prefix of the rotated value, action: injected — rotation)"
    chain_valid: true
    state_modified_field: true

anti_slop_assertions:
  - rule: "AS-01"
    verification: "No mocks on the daemon vault or cache: the same capcli-daemon process serves the pre-rotation cache state, the rotation, and the probe dispatch — assert its PID is identical across all three phases (no restart, no cache wipe-by-restart), so the in-place eviction path is the only way the probe sees the new credential."
  - rule: "AS-06"
    verification: "Hardcoded stale-eviction proof: after rotation, a raw memory scan of the daemon's vault cache region finds 0 occurrences of the pre-rotation literal 'sk_live_VS11_OLD_2b8e'; the probe dispatch's injected Authorization header hashes to sha256('sk_live_VS11_ROTATED_3d7f') = '13dd9cf1f684d527bbf9aafd8c7c4d460c2e8f406acaaf94e31ea09b415f71b3' — both expectations are immutable literals."
  - rule: "AS-05"
    verification: "Rotation audit proof: _audit gained exactly 1 vault.set event with the rotated value's hash prefix and masked representation, prev_hash links correctly, verify_chain() passes; SELECT value FROM secrets WHERE name='vault://stripe_key' returns a ciphertext blob that differs byte-wise from the pre-rotation blob (the row was re-encrypted in place)."
