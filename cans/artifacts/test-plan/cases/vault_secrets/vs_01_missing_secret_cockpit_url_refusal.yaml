$schema: "test-plan/case/v1"
case_id: "vs_01_missing_secret_cockpit_url_refusal"
title: "Headless run requesting a missing vault secret exits 3 with the Cockpit injection URL in the remedy and zero parameter leakage"
domain: "vault_secrets"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/agent.md#suspension-—-headless-execution-exits-with-code-3-on-missing-secrets;-interactive-sessions-pause-via-ask"
  statement: "When a routine's secret_ref trips the pre-call detection check before egress and the vault holds no such credential, headless CLI execution exits with code 3 (policy.secrets) and the diagnostic remedy points the human supervisor at the Cockpit vault injection screen (http://127.0.0.1:4040/vault) — the kernel never accepts the secret value from CLI flags or echoes parameters as substitutes."
  blast_radius_if_breached: "A missing credential is silently skipped, or worse: the harness works around the vault by passing sk_live keys on the command line (shell history, ps aux, and audit logs capture them), or the refusal leaks the other supplied params — credential exfiltration through the very channel meant to protect them."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent 'fixes' the missing secret by passing the value as a CLI flag (--secret sk_live_123) and asserts a successful run, or asserts exit 3 without checking that no param values were echoed to any output stream (catalog banned slop: accepting secret values passed directly as CLI command-line flags)."
  anti_slop_mitigation: "AS-03 forces the typed exit 3 with diagnostic.domain policy.secrets and the Cockpit URL literal in the remedy; AS-02 proves the secrets table stays empty and zero rows mutated; AS-06 hardcodes that the supplied params and any secret-looking literals appear in zero output streams."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "user:dana"
    agent_id: "agt_vs_01"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "secrets"
        row_count: 0
      - name: "routines"
        row_count: 1
      - name: "_audit"
        row_count: 4
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli run cap://stripe.refund_charge -p charge_id=ch_1F2a9b -p amount_cents=8400 -m \"refund duplicate charge\""
  input_params:
    charge_id: "ch_1F2a9b"
    amount_cents: 8400
    requested_secret_ref: "stripe_key"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "policy.secrets"
    culprit: "credential 'stripe_key' not found in vault (pre-call check tripped before egress)"
    remedy: "prompt human supervisor to inject the credential via Cockpit (http://127.0.0.1:4040/vault), or bind CAPCLI_SECRET_STRIPE_KEY in the environment, then re-run"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "routine.run (decision: denied, effect: none; domain policy.secrets)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-03"
    verification: "Parse the --json CliEnvelope: exit_code == 3 (the missing-secret suspension law, NOT the exit 2 trust denial), state_modified == false, diagnostic.domain == 'policy.secrets', diagnostic.remedy contains the literal 'http://127.0.0.1:4040/vault'; stdout prefix '[dev:tier_1]'."
  - rule: "AS-02"
    verification: "Direct substrate check: SELECT count(*) FROM secrets returns 0 before and after (nothing was provisioned by the failed run), and no domain table gained rows — the refusal is pre-egress and pre-mutation."
  - rule: "AS-06"
    verification: "Zero-param-leakage with hardcoded literals: grep stdout, stderr, and the new _audit row's payload for the strings 'ch_1F2a9b', '8400' as secret substitutes, and any 'sk_live'/'sk_test' pattern — 0 occurrences each; additionally the parser must reject '--secret <val>' on this command (usage refusal), proving no CLI flag channel exists."
