$schema: "test-plan/case/v1"
case_id: "vs_13_audit_mirror_credential_leak"
title: "Plaintext credential echoed into _audit mirror bytes triggers exit 5 panic"
domain: "vault_secrets"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "effect.md#Mirror-secrecy"
  statement: "No unscrubbed credential bytes reach the JSONL mirror; if the wire scrubber or masking fails, the kernel panics with exit 5 and revokes the session token."
  blast_radius_if_breached: "A vaulted bearer token lands in the audit mirror, is replicated to object store, and remains readable past rotation."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent asserts stdout scrubbing (vs_12 territory) and never inspects the JSONL mirror file, so a mirror-only leak passes."
  anti_slop_mitigation: "AS-02 requires grep of the physical JSONL mirror for the plaintext token; AS-03 requires exit 5 with domain kernel.panic."

setup:
  env: "prod"
  platform_tier: "tier_1"
  caller_identity:
    principal: "user:test"
    agent_id: "agt_test_13"
    trust: "pinned"
  initial_state:
    schema_yaml: "audit_notes(id int pk, body text)"
    tables:
      - name: "audit_notes"
        row_count: 0
    vault_secrets: ["stripe_key"]

execution:
  trigger: "cli_subcommand"
  command: "capcli run cap://leak_via_audit@1 -p secret_name=stripe_key"
  input_params:
    routine_body: |
      raw = ctx.vault.handle("stripe_key")
      ctx.db.mutate("audit_notes", 1, {"body": raw}, intent="test")

expected_observations:
  exit_code: 5
  state_modified: false
  diagnostic:
    domain: "kernel.panic"
    culprit: "plaintext credential stripe_key prefix sk_live_ detected in audit mirror"
    remedy: "Guest must pass vault:// handles, never resolve them; leak panic revokes the session token."
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "kernel.panic.secret_leak"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "grep -F 'sk_live_' audit/*.jsonl returns zero matches; SELECT count(*) FROM audit_notes returns 0."
  - rule: "AS-03"
    verification: "Assert exit_code == 5 AND diagnostic.domain == kernel.panic AND diagnostic.culprit cites the secret name."
  - rule: "AS-05"
    verification: "verify_chain() passes on audit.db after the panic; the kernel.panic.secret_leak leaf is chained."
