$schema: "test-plan/case/v1"
case_id: "vs_10_secret_scope_environment_isolation"
title: "A prod-scoped secret cannot be queried or injected from a sim/dev session — cross-environment secret resolution is denied with exit 2, not treated as missing"
domain: "vault_secrets"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/agent.md#workspace-pinning-—-active-session-and-principal-pinned-to-envs/<name>/workspace.db"
  statement: "Secrets live in the environment-pinned workspace substrate (envs/<name>/workspace.db) with a scope binding: a secret configured with scope 'prod' is not resolvable when the session environment is 'sim' or 'dev' — the scope resolver denies the cross-environment read/injection (policy denial, exit 2) rather than falling through to the missing-secret suspension path, because the credential exists but is out of scope."
  blast_radius_if_breached: "Sim and dev rehearsals pull live production credentials: every test run, fixture snapshot, and masked-data fork carries real sk_live material — a dev laptop compromise or a sim seed leak becomes a production payment credential breach."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent copies the prod secret into the sim workspace fixture (defeating the isolation), or accepts the exit 3 missing-secret path as a pass because the sim vault 'happens' to be empty, masking that the scope resolver never ran (catalog banned slop: allowing dev/sim environments to pull production secrets)."
  anti_slop_mitigation: "AS-03 forces the typed exit 2 scope denial (distinct from vs_01's exit 3 missing-secret suspension) with the policy.secrets domain citing the prod scope from a sim session; AS-02 proves the prod ciphertext was never decrypted or copied; AS-06 hardcodes the zero-decrypt telemetry expectation."

setup:
  env: "sim"
  platform_tier: "tier_1"
  caller_identity:
    principal: "user:maya"
    agent_id: "agt_vs_10"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "secrets"
        row_count: 1
      - name: "routines"
        row_count: 1
      - name: "_audit"
        row_count: 4
    vault_secrets:
      - ref: "vault://stripe_key"
        scope: "prod"

execution:
  trigger: "cli_subcommand"
  command: "capcli run cap://pay@2 -p charge_id=ch_9d21K -m \"sim rehearsal requesting prod-scoped credential\" --env sim"
  input_params:
    charge_id: "ch_9d21K"
    requested_secret_ref: "vault://stripe_key"
    secret_scope: "prod"
    session_env: "sim"

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.secrets"
    culprit: "secret vault://stripe_key scope 'prod' not resolvable from session env 'sim': cross-environment secret sharing is denied (session workspace pinned to envs/sim/workspace.db; the credential exists but is out of scope)"
    remedy: "provision a sim-scoped secret for the rehearsal ('capcli sys vault set vault://stripe_key_sim --scope sim --in @-') or execute the egress from env prod with reviewed trust"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "routine.run (decision: denied, effect: none; rule policy.secrets.scope_isolation)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-03"
    verification: "Parse the --json CliEnvelope: exit_code == 2 (scope policy denial — NOT the exit 3 missing-secret suspension of vs_01, because the secret exists), state_modified == false, diagnostic.domain == 'policy.secrets', diagnostic.culprit pairs scope 'prod' with session env 'sim'; stdout prefix '[sim:tier_1]'."
  - rule: "AS-02"
    verification: "Substrate isolation proof: SELECT count(*) FROM secrets on envs/sim/workspace.db returns no prod-scoped row for 'vault://stripe_key' (the prod row lives only in envs/prod/workspace.db), and the prod secrets row is byte-identical before and after — no copy, no mutation, no new sim row."
  - rule: "AS-06"
    verification: "Hardcoded zero-decrypt expectation: the kernel key-usage telemetry shows 0 decrypt operations for 'vault://stripe_key' during the sim run (the prod ciphertext was never opened), and the denied run's audit payload contains no secret-derived bytes — only the scope mismatch citation."
