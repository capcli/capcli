$schema: "test-plan/case/v1"
case_id: "we_01_proactive_bucket_exhaustion"
title: "Empty token bucket with >2s refill wait proactively yields exit 6 before any packet leaves the kernel"
domain: "wire_egress"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Quotas"
  statement: "Dial 1 Cadence governs the socket edge: when the local leaky bucket is empty the kernel computes the expected refill wait — under 2s it sleeps the socket transparently, over 2s it yields the routine proactively with exit 6 (budget.md#Quotas). At 0 tokens with a 0.1 token/s refill the expected wait is 10s, so dispatch is never attempted and no packet leaves the kernel. Exit 2 is reserved for Dial 2 ceiling breach, never cadence."
  blast_radius_if_breached: "A drained provider bucket that kept receiving dispatch attempts anyway would trigger upstream 429 storms, provider-side bans of enterprise API keys, and cascading routine failures in every session that shares the provider."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting a network timeout or generic connection error instead of the local cadence yield — e.g. mocking the HTTP client to return a timeout and asserting .is_err(), which proves nothing about the proactive yield path."
  anti_slop_mitigation: "AS-03 forbids .is_err()/.is_ok() assertions: the integer exit code must equal 6 and the CliEnvelope diagnostic block (domain, culprit, remedy) must be parsed. AS-01 bans mocking the token-bucket counters (quota_gate.rs path). AS-02 physically queries _api_quota to prove the row and every table are untouched and no packet was dispatched. AS-04 bans a real 10s sleep: the yield decision is proactive from bucket state."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_we_01"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_api_quota"
        row_count: 1   # provider 'threads': bucket empty, 0 tokens available, refill 0.1/s, status tracked
    vault_secrets: []

execution:
  trigger: "rust_api"
  command: 'ctx.api.call("threads.posts", params={"text": "daily ops digest"}, intent="daily ops digest") invoked through the capcli-core engine API with the cadence bucket pre-drained to 0 tokens'
  input_params:
    verb: "threads.posts"
    tokens_available: 0
    refill_rate_per_sec: 0.1   # expected wait for 1 token = 10s, over the 2s proactive-yield threshold
    cadence_threshold_s: 2

expected_observations:
  exit_code: 6
  state_modified: false
  diagnostic:
    domain: "policy.quota"
    culprit: "cadence bucket exhausted for threads.posts: 0 tokens available, expected refill wait 10s exceeds the 2s threshold — proactive yield before egress; no packet dispatched"
    remedy: "the frame resumes on bucket refill (reset_at) via capcli-daemon; do not retry in a tight loop — the local bucket is the cadence authority"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "api.call (decision: yielded, effect: none)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-01"
    verification: "No mock of the token-bucket counter or the quota gate: the 0-token state is a real _api_quota row read by the engine and the yield must be produced by the production cadence path (assembly.md#Core-domain-subsystems quota_gate.rs 'yields exit 6 when expected wait exceeds 2s'), never by a stubbed client error."
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _api_quota returns 1 before and after execution (strict equality); the threads row's remaining field still reads 0; no business tables exist in the world, so zero side effects are provable."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 6 (not a timeout, not exit 2/4/5) and parse the CliEnvelope JSON: diagnostic.domain == 'policy.quota', the culprit cites 0 tokens and the 10s expected wait against the 2s threshold, and a non-empty remedy is present; a bare .is_err() assertion is a linter failure."
  - rule: "AS-04"
    verification: "Deterministic MockClock, no real sleeps: the kernel must decide the yield proactively from bucket state (0 tokens / 0.1 per s = 10s expected) without sleeping the 10s; any real 10-second wait or SystemTime::now usage fails the linter."
