$schema: "test-plan/case/v1"
case_id: "we_07_429_backoff_jitter_retry"
title: "Upstream 429 with Retry-After yields exit 6 proactively with zero retries"
domain: "wire_egress"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/budget.md#Quotas"
  statement: "'Upstream 429 with Retry-After — the routine yields proactively (exit 6)' (budget.md#Quotas Dial 1): the kernel never retries a 429 carrying Retry-After — idempotent or not. The single attempt drains the local bucket, header auto-tuning records the provider's reset, and the frame yields for daemon resume at reset_at."
  blast_radius_if_breached: "Retries on a 429 would amplify load on an already-throttled provider, escalate rate-limit penalties to enterprise-key suspension, and burn session fuel on doomed dispatches."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting the surfaced error without counting transmissions — a kernel that retries the 429 (the old backoff behavior) passes a bare exit-code assertion while violating the zero-retry law."
  anti_slop_mitigation: "AS-06 forces the hardcoded literal of exactly 1 transmission and 0 retries, counted on the wiremock server — never from the kernel's own retry counter. AS-03 requires the typed exit 6 plus parsed diagnostic citing the 429 and Retry-After. AS-04 bans real 60s sleeps: the yield is proactive, the Retry-After feeds the resume cursor."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_we_07"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_api_quota"
        row_count: 1   # provider 'threads': 30 of 50 tokens available locally; provider window itself exhausted
    vault_secrets: []

execution:
  trigger: "json_rpc"
  command: 'ctx.api.call("threads.posts", params={"text": "status digest"}, intent="ops status digest") against a wiremock stub returning HTTP 429 with Retry-After: 60'
  input_params:
    verb: "threads.posts"
    http_status: 429
    retry_after_s: 60
    idempotent: true

expected_observations:
  exit_code: 6
  state_modified: false
  diagnostic:
    domain: "policy.quota"
    culprit: "upstream provider threads returned HTTP 429 with Retry-After: 60 on the single dispatch attempt — zero retries by law; the routine yields proactively and resumes at the provider reset window"
    remedy: "capcli-daemon resumes the frame at reset_at; the caller never re-dispatches manually — the denial cites remaining + reset_at so the resume is scheduled, not hammered"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 1   # exactly 1 dispatch attempt; the 429 response triggers the yield, never a retry
    syscall_42_trapped: false
  audit:
    event_emitted: "api.call (decision: yielded, effect: none; 429 recorded with Retry-After: 60)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) on _api_quota and every business table before/after is identical (strict equality) — the yielded call committed nothing; the local bucket row reflects the single drained dispatch."
  - rule: "AS-03"
    verification: "Assert integer exit_code == 6 and parse the CliEnvelope diagnostic: domain == 'policy.quota', the culprit names the 429 and Retry-After: 60, and the denial cites remaining + reset_at (policy.yaml#api.in_flight_polling.audit.denial_cites_remaining)."
  - rule: "AS-04"
    verification: "Deterministic MockClock, no real sleeps: the Retry-After: 60 feeds the frame's resume cursor — the kernel must NOT sleep 60s; any tokio::time::sleep / SystemTime::now usage fails the linter."
  - rule: "AS-06"
    verification: "Hardcoded literals: exactly 1 transmission attempt and 0 retries, counted on the wiremock server request counter — expected values are literals, not derived from the kernel's own dispatch counter."
