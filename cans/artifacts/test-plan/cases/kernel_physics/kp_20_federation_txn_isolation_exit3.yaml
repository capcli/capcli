$schema: "test-plan/case/v1"
case_id: "kp_20_federation_txn_isolation_exit3"
title: "ctx.call to ws:// inside ctx.db.txn is rejected with exit 3"
domain: "kernel_physics"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/physics.md#federation-isolation"
  statement: "Federated calls are forbidden inside kernel saga transactions: ctx.call to a ws:// target issued inside a ctx.db.txn block is rejected with exit 3 (E034_TXN_EXTERNAL_CALL) — a cross-workspace call cannot participate in a local atomic commit, and the lock fence additionally rejects outbound ws:// calls while local ctx.db.lock leases are held."
  blast_radius_if_breached: "Split-brain commits: the local transaction commits while the federated callee fails (or vice versa) — no distributed 2PC exists, so atomicity silently degrades to best-effort across the workspace boundary."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent issues the ws:// call outside the txn block and asserts denial anyway, or tests ctx.api.call (already covered) instead of ctx.call to a ws:// target — both evade the federation-specific isolation gate."
  anti_slop_mitigation: "AS-03 pins exit 3 with the federation-isolation diagnostic; AS-06 hardcodes the txn-wrapped ctx.call('ws://billing/settle_invoice@v2', ...) literal; AS-02 proves the local txn rolled back with zero rows committed."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "orders.ops@example.com"
    agent_id: "agt_kp_20"
    trust: "pinned"
  initial_state:
    schema_yaml: |
      version: 3
      engine: sqlite
      db: workspace.db
      tables:
        orders:
          columns:
            id: int pk
            status: text
    tables:
      - name: "orders"
        row_count: 5
      - name: "_audit"
        row_count: 4
    vault_secrets: []
    # peer daemon for "billing" is up on /run/capcli/billing.sock; the routine below opens a txn first

execution:
  trigger: "routine_ctx_call"
  command: "inside ctx.db.txn(): ctx.db.mutate('UPDATE orders SET status=:s WHERE id=:i', s='held', i=3); ctx.call('ws://billing/settle_invoice@v2', {'invoice_id': 3})"
  input_params:
    target_urp: "ws://billing/settle_invoice@v2"
    inside_txn: true
    local_mutation: "UPDATE orders SET status='held' WHERE id=3"
    expected_code: "E034_TXN_EXTERNAL_CALL"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "compile"
    culprit: "federation isolation — ctx.call to ws:// target 'ws://billing/settle_invoice@v2' forbidden inside ctx.db.txn blocks (E034_TXN_EXTERNAL_CALL); federated calls cannot join local atomic commits"
    remedy: "move the ws:// call outside the txn block: complete the federated call first, then open ctx.db.txn for the local mutation (or vice versa)"
  database:
    row_count_delta: 0 # txn rolled back: the UPDATE never commits
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "federation.call_out (decision: denied, effect: none — federation isolation, inside ctx.db.txn)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-03"
    verification: "Assert exit_code == 3 and parse the CliEnvelope: code == 'E034_TXN_EXTERNAL_CALL' exactly, diagnostic.domain == 'compile' with the federation-isolation culprit naming the ws:// target; exit 2 here would mean the wrong gate fired."
  - rule: "AS-02"
    verification: "SELECT status FROM orders WHERE id=3 != 'held' after the run — the enclosing txn rolled back atomically; zero bytes on /run/capcli/billing.sock; _audit delta is exactly 1 denial event."
  - rule: "AS-06"
    verification: "Hardcoded literals: target 'ws://billing/settle_invoice@v2', txn-wrapped call sequence, expected exit 3; the AST gate must fire on the real routine source — never on a mocked txn context."
