$schema: "test-plan/case/v1"
case_id: "kp_02_platform_tier2_degraded_boot"
title: "Tier 2 boot degrades sandbox to broker with visible WARN; pinned dev-target execution proceeds"
domain: "kernel_physics"
target_tier: "integration"
target_crate: "crates/capcli-daemon"

invariant:
  law_reference: "cans/physics.md#sandbox-degraded-on-tier-2"
  statement: "Booting on a tier 2 host (macOS/Windows) without bwrap never fails silently and never upgrades isolation: boot must emit [WARN] host.degraded_isolation and drop the sandbox provider to the IPC broker + C authorizer path. Under the Weakest Link matrix, degraded isolation does not deny execution — a pinned routine targeting dev proceeds (exit 0); only the prod target is refused, by tier, not by sandbox quality."
  blast_radius_if_breached: "A degraded boot that swallows the warning runs broker-sandboxed code while operators believe bwrap namespaces are active — misplaced confidence in containment on developer laptops and endpoint machines."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts only that the daemon started and never parses the boot log for the [WARN] host.degraded_isolation line; or runs the case on the CI host default platform so the Tier 2 degradation path is never exercised."
  anti_slop_mitigation: "AS-07 forces the explicit two-configuration platform matrix (Tier 1 pinned dev run must pass; Tier 2 degraded pinned dev run must pass with the warning parsed); AS-03 requires parsing the boot warning line and asserting the broker provider in the execution receipt; AS-02 proves the payouts settlement is exactly the routine's declared batch."

setup:
  env: "dev"
  platform_tier: "tier_2"
  caller_identity:
    principal: "finance.ops@example.com"
    agent_id: "agt_kp_02"
    trust: "pinned"
  initial_state:
    schema_yaml: |
      version: 1
      engine: sqlite
      db: workspace
      tables:
        payouts:
          cols:
            id: pk
            status: 'text=pending'
            amount_cents: int
          idx: [status]
    tables:
      - name: "payouts"
        row_count: 2
      - name: "_audit"
        row_count: 7
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: 'capcli run payout_settle -p batch=daily -m "settle daily payout batch" (issued against a daemon freshly booted on a macOS host with bwrap absent)'
  input_params:
    host_os: "darwin"
    bwrap_present: false
    sandbox_provider_expected: "broker"
    boot_warning_expected: "[WARN] host.degraded_isolation"
    routine_trust: "pinned"

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: null
    culprit: null
    remedy: null
  database:
    row_count_delta: 0
    tables_mutated:
      - "payouts"
      - "_audit"
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "routine.run (decision: allowed, effect: applied; sandbox_provider: broker)"
    chain_valid: true
    state_modified_field: true

anti_slop_assertions:
  - rule: "AS-07"
    verification: "Run the pinned dev-target execution in two injected platform configurations: PlatformTier::Tier1 (run must succeed) and PlatformTier::Tier2 with bwrap absent (run must succeed with exit 0); the platform tier is injected via the platform probe, never inferred from the CI host accidental OS."
  - rule: "AS-03"
    verification: "Assert exit_code == 0 and parse two outputs: the daemon boot log must contain the literal line '[WARN] host.degraded_isolation' (warning not swallowed, provider reported as broker), and the CliEnvelope<T> must carry state_modified == true with a null diagnostic."
  - rule: "AS-02"
    verification: "SELECT count(*) FROM payouts WHERE status = 'settled' on envs/dev/workspace.db moves 0 -> 2 (the declared daily batch, no more, no fewer); _audit advances 7 -> 8 with exactly one routine.run allowed row."
