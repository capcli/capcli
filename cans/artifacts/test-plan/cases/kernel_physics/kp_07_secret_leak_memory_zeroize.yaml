$schema: "test-plan/case/v1"
case_id: "kp_07_secret_leak_memory_zeroize"
title: "Decrypted AES-256 vault buffer zeroized in memory after subshell CLI exit"
domain: "kernel_physics"
target_tier: "unit"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/physics.md#credentials-isolation"
  statement: "In-memory decrypted secret buffers live only for the duration of a subshell CLI invocation: on subshell exit the buffer region is overwritten with zeroes (zeroize) before the allocator can reuse or swap it, so plaintext credentials never outlive the CLI process."
  blast_radius_if_breached: "Production credentials persist in freed heap memory: a later core dump, swap file, or heap-spraying routine reads the stale plaintext secret — vault encryption at rest is defeated in memory and enterprise-wide credential rotation is forced."

confusion_matrix:
  quadrant: "true_positive"
  slop_risk: "Agent asserts that the Rust variable simply went out of scope (Drop ran) without reading the raw pointer memory to prove the bytes are actually zero — a scope drop proves nothing about buffer contents."
  anti_slop_mitigation: "AS-06 pins the expected all-zero buffer literal and mandates the raw pointer scan; AS-01 bans mocking the vault decryption or zeroize boundary; AS-05 verifies the audited write and chain link from the completed subshell CLI; AS-03 requires exit_code == 0 with state_modified == true."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "notifications.ops@example.com"
    agent_id: "agt_kp_07"
    trust: "reviewed"
  initial_state:
    schema_yaml: |
      version: 1
      engine: sqlite
      db: workspace
      tables:
        dispatch_log:
          cols:
            id: pk
            channel: 'text=smtp'
            status: 'text=queued'
    tables:
      - name: "dispatch_log"
        row_count: 0
      - name: "_audit"
        row_count: 3
    vault_secrets: ["smtp_creds"]

execution:
  trigger: "rust_api"
  command: 'capcli_core::vault::with_decrypted("smtp_creds") executed inside a spawned subshell CLI worker that performs the audited write INSERT INTO dispatch_log (channel, status) VALUES (:c, :s) with params { c: smtp, s: queued }; after subshell exit the harness re-reads the buffer heap window via ptr::read_volatile'
  input_params:
    secret_name: "smtp_creds"
    secret_length_bytes: 32
    audited_write: "INSERT INTO dispatch_log (channel, status) VALUES (:c, :s)"
    bound_params: { c: "smtp", s: "queued" }

expected_observations:
  exit_code: 0
  state_modified: true
  diagnostic:
    domain: "vault.memory"
    culprit: "decrypted AES-256 buffer heap region — the exact scan target that must read as all zeroes after subshell CLI exit"
    remedy: "none required on the success path — zeroization is automatic on subshell CLI exit; verification is the raw pointer scan across the full buffer allocation"
  database:
    row_count_delta: 1
    tables_mutated: ["dispatch_log"]
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "db.exec"
    chain_valid: true
    state_modified_field: true

anti_slop_assertions:
  - rule: "AS-06"
    verification: "The expected post-zeroize buffer content is the immutable literal of 32 zero bytes (0x00 x 32) — the harness reads the raw pointer region (ptr::read_volatile across the full allocation window) and compares byte-for-byte; asserting only Drop/scope exit is rejected."
  - rule: "AS-01"
    verification: "The AES-256 vault decryption and the zeroize path run for real — no mock vault and no stubbed zeroize crate; the secret is genuinely decrypted into the heap window under test."
  - rule: "AS-05"
    verification: "Verify the completed subshell write: SELECT count(*) FROM dispatch_log returns 1; _audit advances 3 -> 4 with a db.exec row whose prev_hash equals the SHA-256 of the prior row and whose result_hash matches the canonical JSON hash of the output."
  - rule: "AS-03"
    verification: "Assert exit_code == 0 and parse CliEnvelope<T>: state_modified == true, the data block carries the receipt, audit_op references the db.exec event; an .is_ok()-only assertion is rejected."
