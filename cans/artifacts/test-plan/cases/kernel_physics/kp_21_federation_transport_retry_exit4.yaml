$schema: "test-plan/case/v1"
case_id: "kp_21_federation_transport_retry_exit4"
title: "Missing peer socket exhausts the policy dial budget and exits 4 (E055_FEDERATION_UNREACHABLE)"
domain: "kernel_physics"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/physics.md#Federation-invariants"
  statement: "A missing peer socket dials with exponential backoff against the budget configured at artifacts/policy.yaml#network.dial (default total_ms 10000, tick_interval_ms 500, backoff 2.0); on budget exhaustion the federated call fails closed with exit 4 (E055_FEDERATION_UNREACHABLE) — bounded retry, never an unbounded hang, and the caller frame survives to handle the failure. Fail-closed is invariant; the budget is policy."
  blast_radius_if_breached: "Unbounded hangs on dead peers: a routine awaiting a decommissioned workspace blocks its frame forever — budget watchdogs eventually fire, but every intermediate frame in the chain burns wall-clock and fuel waiting on nothing."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent uses real sleeps (slow, flaky) or kills the peer mid-dial and asserts on the wrong exit (exit 2 policy denial instead of the exit 4 transport failure)."
  anti_slop_mitigation: "AS-04 steps the backoff schedule deterministically via MockClock — zero real sleeping; AS-03 pins exit 4 exactly with the E055_FEDERATION_UNREACHABLE code; AS-06 hardcodes the missing socket path '/run/capcli/ghost.sock' and the dial budget literals."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "orders.ops@example.com"
    agent_id: "agt_kp_21"
    trust: "pinned"
  initial_state:
    schema_yaml: |
      version: 3
      engine: sqlite
      db: workspace.db
      tables:
        _budget_frames:
          columns:
            frame_id: text pk
            routine: text
            session: text
    tables:
      - name: "_budget_frames"
        row_count: 1
      - name: "_audit"
        row_count: 4
    vault_secrets: []
    # federation pre-condition: NO daemon listens on /run/capcli/ghost.sock (peer decommissioned);
    # workspace "ghost" is allowlisted and the target routine is pinned — only transport fails

execution:
  trigger: "routine_ctx_call"
  command: "ctx.call('ws://ghost/ping@v1', {}) with peer socket absent"
  input_params:
    target_urp: "ws://ghost/ping@v1"
    peer_socket: "/run/capcli/ghost.sock"
    socket_present: false
    dial_budget: "total_ms 10000, tick_interval_ms 500, backoff 2.0 (artifacts/policy.yaml#network.dial)"

expected_observations:
  exit_code: 4
  state_modified: false
  diagnostic:
    domain: "federation.transport"
    culprit: "E055_FEDERATION_UNREACHABLE — peer socket '/run/capcli/ghost.sock' absent after dial budget exhaustion (total_ms 10000, backoff schedule stepped); workspace 'ghost' unreachable"
    remedy: "verify the peer daemon is running (systemctl status capcli-daemon@ghost), the socket path exists, and WireGuard mesh membership is current; retry the call; tune artifacts/policy.yaml#network.dial for slower peers"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "federation.call_out (decision: denied, effect: none — E055_FEDERATION_UNREACHABLE after dial budget exhaustion)"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-03"
    verification: "Assert exit_code == 4 (integer) — NOT exit 2 and NOT exit 5 — and parse the diagnostic: domain == 'federation.transport', culprit contains 'E055_FEDERATION_UNREACHABLE' and the socket path; the caller frame must remain alive (no frame abort)."
  - rule: "AS-04"
    verification: "The dial schedule is stepped deterministically: MockClock::advance walks the backoff ticks (500ms, 1s, 2s, 4s) to the 10000ms budget via the engine API — the test contains zero real sleeps and zero SystemTime::now() reads; wall-clock runtime of the test stays under 100ms."
  - rule: "AS-06"
    verification: "Hardcoded literals: socket '/run/capcli/ghost.sock', dial budget total_ms 10000 / tick_interval_ms 500 / backoff 2.0, expected code 'E055_FEDERATION_UNREACHABLE'; the absence is a real missing socket file — never a mocked transport error."
