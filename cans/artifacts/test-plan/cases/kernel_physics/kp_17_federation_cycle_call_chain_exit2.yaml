$schema: "test-plan/case/v1"
case_id: "kp_17_federation_cycle_call_chain_exit2"
title: "Federated call whose call_chain already contains the workspace fails closed with exit 2 (E041_FEDERATION_CYCLE)"
domain: "kernel_physics"
target_tier: "integration"
target_crate: "crates/capcli-core"

invariant:
  law_reference: "cans/physics.md#Federation-invariants"
  statement: "Bounded re-entry: a workspace may re-enter a call tree exactly once, riding the idempotency key of its first entry; a third entry by one workspace, or any re-entry on a new key — including a re-entry carrying no key at all — fails closed with exit 2 (E041_FEDERATION_CYCLE) before any socket write. call_chain carries (workspace, idempotency_key) per hop. This case pins the keyless re-entry denial: billing calling back into orders without the original idempotency key is refused."
  blast_radius_if_breached: "Unbounded cross-workspace recursion: workspace A calls B calls A on fresh keys, each hop spawning frames and burning delegated budget until both daemons exhaust session ceilings — a distributed fork bomb with audit events on both sides and no termination condition."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "Agent tests a self-call (workspace calling itself directly, call_chain of length 1) instead of a genuine 2-hop cycle, or asserts the denial after the IPC socket write already happened — both miss the pre-write fail-closed requirement."
  anti_slop_mitigation: "AS-03 pins exit 2 exactly with the E041_FEDERATION_CYCLE code parsed from the diagnostic; AS-06 hardcodes the two-workspace call_chain literals (orders -> billing -> orders); AS-02 proves zero frames pushed in either workspace and zero socket bytes written."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "orders.ops@example.com"
    agent_id: "agt_kp_17"
    trust: "pinned"
  initial_state:
    schema_yaml: |
      version: 3
      engine: sqlite
      db: workspace.db
      tables:
        _budget_frames:
          columns:
            frame_id: text pk
            routine: text
            session: text
    tables:
      - name: "_budget_frames"
        row_count: 1 # root frame frame_001 in session ses_kp17
      - name: "_audit"
        row_count: 4 # genesis sequence
    vault_secrets: []
    # federation pre-condition: peer daemon for workspace "billing" listens on /run/capcli/billing.sock,
    # socket-authenticated via SO_PEERCRED; the inbound IPC envelope to this test carries
    # call_chain: [("orders", key_o1), ("billing", key_b1)] — i.e. billing is calling back into orders,
    # but the re-entry carries NO idempotency key matching orders' first entry (key_o1): keyless re-entry

execution:
  trigger: "routine_ctx_call"
  command: "ctx.call('ws://orders/recalc_totals@v3', {'region': 'EMEA'}) executed inside routine billing/settle_invoice@v2 with inbound call_chain [('orders', key_o1), ('billing', key_b1)] and no idempotency key on the re-entry"
  input_params:
    target_urp: "ws://orders/recalc_totals@v3"
    inbound_call_chain: [["orders", "key_o1"], ["billing", "key_b1"]]
    reentry_idempotency_key: null
    local_workspace: "orders"
    callee_trust: "pinned"

expected_observations:
  exit_code: 2
  state_modified: false
  diagnostic:
    domain: "policy.federation"
    culprit: "E041_FEDERATION_CYCLE — re-entry into workspace 'orders' carries no idempotency key matching its first entry (key_o1); keyless re-entry fails closed before socket write"
    remedy: "re-enter on the original idempotency key (exactly one keyed re-entry per call tree is legal: see cans/physics.md#Federation-invariants), or restructure the call graph to break the cycle"
  database:
    row_count_delta: 0 # no child frame pushed; _audit gains exactly 1 denial event
    tables_mutated: []
  wire:
    packets_transmitted: 0 # refused before any IPC socket write
    syscall_42_trapped: false
  audit:
    event_emitted: "federation.call_out (decision: denied, effect: none — E041_FEDERATION_CYCLE, keyless re-entry into 'orders')"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-03"
    verification: "Assert exit_code == 2 (integer) and parse the diagnostic: domain == 'policy.federation', culprit contains the literal code 'E041_FEDERATION_CYCLE' and names the missing idempotency key; an exit 4 transport error or a generic exit 2 without the code is a failure."
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _budget_frames == 1 before and after — no child frame was pushed in the local workspace; the peer socket received zero bytes (assert via the harness socket tap); _audit delta is exactly 1 denial event."
  - rule: "AS-06"
    verification: "Hardcoded literals: call_chain [('orders', key_o1), ('billing', key_b1)], re-entry idempotency key null, target workspace 'orders', expected code 'E041_FEDERATION_CYCLE'; the denial is realized with two real daemon sockets (/run/capcli/orders.sock, /run/capcli/billing.sock) — never by mocking the cycle checker. Positive control: the same re-entry carrying key_o1 proceeds (exactly one keyed re-entry per call tree is legal)."
