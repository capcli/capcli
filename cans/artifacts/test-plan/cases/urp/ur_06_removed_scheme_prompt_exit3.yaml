$schema: "test-plan/case/v1"
case_id: "ur_06_removed_scheme_prompt_exit3"
title: "Removed prompt:// scheme fails CLI parse with exit 3; prompt campaigns are documents under doc://prompts/"
domain: "urp"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/interface.md#Refusals-and-banned-operations"
  statement: "prompt:// is not a registered scheme: the pointer fails CLI parse with exit 3. Prompts are documents — the same campaign reads as doc://prompts/billing#campaign_v1 through the ArtifactResolver."
  blast_radius_if_breached: "If prompt:// still parsed, the merged document law would split — two address forms for one resource class, two resolver paths, and every prompt-aware tool would need bespoke scheme handling again."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting exit 3 on a string match of the input — the real parser grammar (which must reject the scheme token) is never exercised."
  anti_slop_mitigation: "The real capcli binary runs with the literal argv; AS-03 requires the diagnostic to name the removed scheme 'prompt://' and point at the doc://prompts/ replacement; AS-02 requires zero audit rows."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_ur_06"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_audit"
        row_count: 7
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli inspect prompt://billing/dunning@v1"
  input_params:
    raw_argv: "prompt://billing/dunning@v1"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "cli.parse"
    culprit: "removed scheme 'prompt://' — prompts are documents; read the campaign as doc://prompts/billing#v1"
    remedy: "use doc://prompts/billing#v1; only the 10 registered schemes parse as URPs"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "none — parse failure precedes kernel dispatch"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _audit == 7 exactly after the run."
  - rule: "AS-03"
    verification: "exit_code == 3 exactly and the diagnostic names the literal removed scheme 'prompt://' plus the replacement form 'doc://prompts/'."
  - rule: "AS-06"
    verification: "Hardcoded literals: argv 'prompt://billing/dunning@v1', exit 3, audit row count 7."
