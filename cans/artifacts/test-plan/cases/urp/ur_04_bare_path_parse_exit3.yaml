$schema: "test-plan/case/v1"
case_id: "ur_04_bare_path_parse_exit3"
title: "Bare filesystem path passed to a pointer-accepting verb fails CLI parse with exit 3 before any kernel dispatch"
domain: "urp"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/interface.md#Refusals-and-banned-operations"
  statement: "Only scheme://[namespace/]resource[@version][#fragment] pointers parse: a bare filesystem path is rejected by the CLI parser with exit 3, before any session exists, before any resolver dispatches, and before any audit row is written."
  blast_radius_if_breached: "If bare paths parsed, every relative-path typo would dispatch into the resolver engine as an unscoped resource — reads escaping the workspace root, writes landing on unintended tables — with the failure surfacing deep in kernel code instead of at the parse boundary."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting exit 3 from a mocked parser — the real CLI binary is never invoked, so a regression that lets bare paths through the actual clap grammar would pass silently."
  anti_slop_mitigation: "The command must run the real capcli binary as a child process with the literal argv; AS-02 asserts the _audit row count is unchanged (parse precedes dispatch, so no audit event exists to fake). AS-03 matches the diagnostic grammar text, not just the exit code."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_ur_04"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_audit"
        row_count: 7   # ledger baseline; parse failure must add zero rows
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli inspect orders/sync.py"
  input_params:
    raw_argv: "orders/sync.py"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "cli.parse"
    culprit: "pointer grammar violation: 'orders/sync.py' carries no scheme prefix — only scheme://[namespace/]resource[@version][#fragment] pointers parse"
    remedy: "address the resource with a registered scheme (cap://, db://, doc://, tpl://, …); bare filesystem paths never parse"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "none — parse failure precedes kernel dispatch; no session exists, so no audit row is written"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _audit == 7 exactly after the run — a parse refusal writes no audit row; any emitted event fails the test."
  - rule: "AS-03"
    verification: "Match exit_code == 3 exactly and the diagnostic names the offending literal 'orders/sync.py' plus the grammar 'scheme://[namespace/]resource[@version][#fragment]' — exit code alone is not enough."
  - rule: "AS-06"
    verification: "Hardcoded literals: argv 'orders/sync.py', exit 3, audit row count 7 — never derived from CLI output."
