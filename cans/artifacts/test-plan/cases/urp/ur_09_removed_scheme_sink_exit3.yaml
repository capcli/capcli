$schema: "test-plan/case/v1"
case_id: "ur_09_removed_scheme_sink_exit3"
title: "Removed sink:// scheme fails CLI parse with exit 3; telemetry egress lives in governance.yaml#telemetry"
domain: "urp"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/interface.md#Refusals-and-banned-operations"
  statement: "sink:// is not a registered scheme: the pointer fails CLI parse with exit 3. Telemetry egress is configuration under governance.yaml#telemetry, not an addressable resource."
  blast_radius_if_breached: "If sink:// still parsed, telemetry destinations would be addressable as resources — inspectable, resolvable — and egress configuration would fork into two homes (the URP and the governance config), breaking the one-home rule for sink declarations."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting exit 3 on a string match of the input — the real parser grammar (which must reject the scheme token) is never exercised."
  anti_slop_mitigation: "The real capcli binary runs with the literal argv; AS-03 requires the diagnostic to name the removed scheme 'sink://' explicitly; AS-02 requires zero audit rows."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_ur_09"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_audit"
        row_count: 7
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli inspect sink://alerts"
  input_params:
    raw_argv: "sink://alerts"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "cli.parse"
    culprit: "removed scheme 'sink://' — telemetry egress is configuration under governance.yaml#telemetry, not a resource pointer"
    remedy: "declare sinks in governance.yaml#telemetry; only the 10 registered schemes parse as URPs"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "none — parse failure precedes kernel dispatch"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _audit == 7 exactly after the run."
  - rule: "AS-03"
    verification: "exit_code == 3 exactly and the diagnostic names the literal removed scheme 'sink://'."
  - rule: "AS-06"
    verification: "Hardcoded literals: argv 'sink://alerts', exit 3, audit row count 7."
