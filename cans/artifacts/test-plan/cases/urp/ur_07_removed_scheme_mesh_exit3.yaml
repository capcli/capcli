$schema: "test-plan/case/v1"
case_id: "ur_07_removed_scheme_mesh_exit3"
title: "Removed mesh:// scheme fails CLI parse with exit 3; mesh peers are WireGuard transport endpoints, not URPs"
domain: "urp"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/interface.md#Refusals-and-banned-operations"
  statement: "mesh:// is not a registered scheme: the pointer fails CLI parse with exit 3. Mesh peers are WireGuard overlay endpoints configured under policy.yaml#network.transports, never resource pointers."
  blast_radius_if_breached: "If mesh:// still parsed, peer addresses would flow into the resolver engine as pseudo-resources — inspect envelopes for sockets, budget frames for endpoints — and transport configuration would leak into capability addressing."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting exit 3 on a string match of the input — the real parser grammar (which must reject the scheme token) is never exercised."
  anti_slop_mitigation: "The real capcli binary runs with the literal argv; AS-03 requires the diagnostic to name the removed scheme 'mesh://' explicitly; AS-02 requires zero audit rows."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_ur_07"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_audit"
        row_count: 7
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli inspect mesh://peers"
  input_params:
    raw_argv: "mesh://peers"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "cli.parse"
    culprit: "removed scheme 'mesh://' — mesh peers are WireGuard transport endpoints (tcp://<peer>:51820), not resource pointers; see artifacts/policy.yaml#network.transports"
    remedy: "configure peers as transport endpoints; only the 10 registered schemes parse as URPs"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "none — parse failure precedes kernel dispatch"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _audit == 7 exactly after the run."
  - rule: "AS-03"
    verification: "exit_code == 3 exactly and the diagnostic names the literal removed scheme 'mesh://'."
  - rule: "AS-06"
    verification: "Hardcoded literals: argv 'mesh://peers', exit 3, audit row count 7."
