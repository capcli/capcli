$schema: "test-plan/case/v1"
case_id: "ur_08_removed_scheme_apis_exit3"
title: "Removed apis:// scheme fails CLI parse with exit 3; provider specs are documents under doc://specs/"
domain: "urp"
target_tier: "e2e"
target_crate: "crates/capcli-cli"

invariant:
  law_reference: "cans/interface.md#Refusals-and-banned-operations"
  statement: "apis:// is not a registered scheme: the pointer fails CLI parse with exit 3. Provider specifications are documents — doc://specs/<provider>#rate_limit — and provider verbs are executables — cap://<provider>/verb."
  blast_radius_if_breached: "If apis:// still parsed, provider addressing would straddle two classes (document reads and executable calls under one scheme) and the resolver dispatch would need bespoke per-scheme rules again — the exact ambiguity the 3-class engine eliminates."

confusion_matrix:
  quadrant: "true_negative"
  slop_risk: "An AI agent fakes this test by asserting exit 3 on a string match of the input — the real parser grammar (which must reject the scheme token) is never exercised."
  anti_slop_mitigation: "The real capcli binary runs with the literal argv; AS-03 requires the diagnostic to name the removed scheme 'apis://' and point at the doc://specs/ replacement; AS-02 requires zero audit rows."

setup:
  env: "dev"
  platform_tier: "tier_1"
  caller_identity:
    principal: "human.oncall@example.com"
    agent_id: "agt_ur_08"
    trust: "reviewed"
  initial_state:
    schema_yaml: null
    tables:
      - name: "_audit"
        row_count: 7
    vault_secrets: []

execution:
  trigger: "cli_subcommand"
  command: "capcli inspect apis://stripe#rate_limit"
  input_params:
    raw_argv: "apis://stripe#rate_limit"

expected_observations:
  exit_code: 3
  state_modified: false
  diagnostic:
    domain: "cli.parse"
    culprit: "removed scheme 'apis://' — provider specs are documents; read the mapping as doc://specs/stripe#rate_limit"
    remedy: "use doc://specs/stripe#rate_limit for the spec or cap://stripe/<verb> for the executable; only the 10 registered schemes parse as URPs"
  database:
    row_count_delta: 0
    tables_mutated: []
  wire:
    packets_transmitted: 0
    syscall_42_trapped: false
  audit:
    event_emitted: "none — parse failure precedes kernel dispatch"
    chain_valid: true
    state_modified_field: false

anti_slop_assertions:
  - rule: "AS-02"
    verification: "SELECT count(*) FROM _audit == 7 exactly after the run."
  - rule: "AS-03"
    verification: "exit_code == 3 exactly and the diagnostic names the literal removed scheme 'apis://' plus the replacement form 'doc://specs/'."
  - rule: "AS-06"
    verification: "Hardcoded literals: argv 'apis://stripe#rate_limit', exit 3, audit row count 7."
