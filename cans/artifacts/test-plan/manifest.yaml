    prefix: "sh"
    case_count: 12
    description: "SDK & guest harness contract — frame token traps, ctx.api/ctx.db rules, manifest reflection over IPC, poll_until aggregate accounting, storage HMAC URLs, claims locks."
    spec_sources: ["cans/action.md", "cans/agent.md"]
