# capcli canonical test plan manifest — machine-readable index of all 140 cases
# Derived from test-plan-structure.md §1 (directory tree) and §6 (master catalog).
# Quadrant and target_tier values MUST match the §6 catalog tables exactly.
$schema: "test-plan/manifest/v1"
plan:
  name: "capcli canonical test plan"
  structure_doc: "cans/artifacts/test-plan/test-plan-structure.md"
  matrix_doc: "cans/artifacts/test-plan/matrix.yaml"
  total_cases: 140
  domains: 11
  crate_tier_convention:
    unit: "crates/capcli-core"
    integration: "crates/capcli-core"
    e2e: "crates/capcli-cli"
    daemon_driven: "crates/capcli-daemon"
domains:
  kernel_physics:
    prefix: "kp"
    case_count: 14
    description: "Kernel physics — dual-engine enforcement, platform tier taxonomy, seccomp-bpf jails, tmpfs scratch isolation, NTP drift halt, audit-sink fail-closed host integrity probes."
    spec_sources: ["cans/physics.md", "cans/world.md", "cans/effect.md"]
  database_authorizer:
    prefix: "da"
    case_count: 13
    description: "Database floor & C-authorizer — unbounded UPDATE/DELETE AST kills, WHERE tautology traps, system table write denial, column/table immutability, row ceilings."
    spec_sources: ["cans/physics.md", "cans/world.md"]
  wire_egress:
    prefix: "we"
    case_count: 13
    description: "Wire floor & quota brokerage — proactive token buckets, JSONPath quota header sync, priority yield floors, vaulted bearer injection, egress byte caps, sim mock fallback."
    spec_sources: ["cans/physics.md", "cans/action.md", "cans/budget.md", "cans/space.md"]
  budget_cascade:
    prefix: "bc"
    case_count: 13
    description: "Budget cage & frame cascade — downward min inheritance, session ops ceilings, fuel pools, earmark ringfence and TTL sweep, watchdogs, suspended-task refill."
    spec_sources: ["cans/budget.md", "artifacts/governance.yaml", "artifacts/policy.yaml", "cans/time.md"]
  audit_dag:
    prefix: "ad"
    case_count: 13
    description: "Memory spine & causal DAG — SHA-256 prev-hash linking, genesis anchors, tamper root-worm walks, FPA redaction, W3C traceparent, JSONL mirror SLA, KMS witness."
    spec_sources: ["cans/effect.md", "cans/space.md"]
  trust_ladder:
    prefix: "tl"
    case_count: 13
    description: "Trust ladder & promotion — draft/reviewed/pinned floors, monotonic ascent, auto-promotion conjunction, canary telemetry demotion, human veto, circuit breaker."
    spec_sources: ["cans/trust.md", "cans/physics.md"]
  schema_evolution:
    prefix: "se"
    case_count: 13
    description: "Schema evolution & validation gates — Gate 1..5 refusals (YAML syntax, cycles, lockfile drift, PRAGMA drift, DDL snapshot), forward-only migration, worktree isolation."
    spec_sources: ["cans/world.md", "cans/recovery.md", "cans/space.md"]
