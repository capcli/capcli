# capcli canonical test plan manifest — machine-readable index of all 192 cases
# Derived from test-plan-structure.md §1 (directory tree) and §6 (master catalog).
# Quadrant and target_tier values MUST match the §6 catalog tables exactly.
$schema: "test-plan/manifest/v1"
plan:
  name: "capcli canonical test plan"
  structure_doc: "cans/artifacts/test-plan/test-plan-structure.md"
  matrix_doc: "cans/artifacts/test-plan/matrix.yaml"
  total_cases: 192
  domains: 12
  crate_tier_convention:
    unit: "crates/capcli-core"
    integration: "crates/capcli-core"
    e2e: "crates/capcli-cli"
    daemon_driven: "crates/capcli-daemon"
domains:
  kernel_physics:
    prefix: "kp"
    case_count: 23
    description: "Kernel physics — dual-engine enforcement, platform tier taxonomy, seccomp-bpf jails, tmpfs scratch isolation, NTP drift halt, audit-sink fail-closed host integrity probes."

  database_authorizer:
    prefix: "da"
    case_count: 15
    description: "Database floor & C-authorizer — unbounded UPDATE/DELETE AST kills, WHERE tautology traps, system table write denial, column/table immutability, row ceilings."

  wire_egress:
    prefix: "we"
    case_count: 14
    description: "Wire floor & quota brokerage — proactive token buckets, JSONPath quota header sync, priority yield floors, vaulted bearer injection, egress byte caps, sim mock fallback."

  budget_cascade:
    prefix: "bc"
    case_count: 20
    description: "Budget cage & frame cascade — downward min inheritance, session ops ceilings, fuel pools, earmark ringfence and TTL sweep, watchdogs, suspended-task refill."

  audit_dag:
    prefix: "ad"
    case_count: 15
    description: "Memory spine & causal DAG — SHA-256 prev-hash linking, genesis anchors, tamper root-worm walks, FPA redaction, W3C traceparent, JSONL mirror SLA, KMS witness."

  trust_ladder:
    prefix: "tl"
    case_count: 18
    description: "Trust ladder & promotion — draft/reviewed/pinned floors, monotonic ascent, auto-promotion conjunction, canary telemetry demotion, human veto, circuit breaker."

  schema_migration:
    prefix: "se"
    case_count: 18
    description: "Schema migration & compile checks — Sub-check 1..3 refusals (YAML syntax, cycles, lockfile drift), live-drift refusal, migration-safety rehearsal, forward-only migration, worktree isolation."

  coordination_claims:
    prefix: "cc"
    case_count: 16
    description: "Coordination & claims — exclusive leases with TTL, contested claim rejection, WAL BEGIN IMMEDIATE serialization, authoring mutex, orphan cleanup, cross-agent event tailing."

  bindings_triggers:
    prefix: "bt"
    case_count: 13
    description: "Bindings & inbound triggers — cron min-interval and catchup limits, webhook HMAC/ceiling/rate gates, endpoint pinned-trust floor, ctx.ping.ask fail-closed timeouts."

  vault_secrets:
    prefix: "vs"
    case_count: 12
    description: "Vault & zero-knowledge secrets — AES-256-GCM ciphertext at rest, scope isolation, env auto-binding, rotation eviction, redacted leak kill, Cockpit WebAuthn injection."

  sdk_harness:
    prefix: "sh"
    case_count: 13
    description: "SDK & guest harness contract — frame token traps, ctx.api/ctx.db rules, manifest reflection over IPC, poll_until aggregate accounting, storage HMAC URLs, claims locks."

  urp:
    prefix: "ur"
    case_count: 11
    description: "URP resolver engine — 3-class dispatch (executable, db-entity, artifact), universal pointer grammar parse law, exit-3 refusals for bare paths and removed schemes, prompts-are-documents read equivalence."

