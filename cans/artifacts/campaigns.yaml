# ═══════════════════════════════════════════════════════════════
# campaigns.yaml — prompt banks & campaign envelopes SSOT
# Pointers: prompt://{bank}/{slug}@{version}
# ═══════════════════════════════════════════════════════════════
version: 1

banks:
  ops_briefing:
    urp: "prompt://system/ops_briefing@v1"
    description: "Domain situation awareness campaign bank"
    envelope:
      max_tokens: 150
      format: markdown_slices
    sections:
      - node: "#context"
        max_tokens: 45
        source: "doc://specs/system_state"
      - node: "#kpis"
        max_tokens: 60
        source: "db://views/system_vitals"
      - node: "#instructions"
        max_tokens: 45
        body: "Operate within declared AST limits. Mutating writes require valid --intent."
