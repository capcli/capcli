# ───────────────────────────────────────────────────────────────
# environments.yaml — environment partitions, per-world overlays, environment ceilings
# Owns:     environment partitions (env://dev, env://sim, env://prod), per-world overlays, environment ceilings
# Not:      verb trust rules & audit log → see policy.yaml
# Not:      telemetry sinks → see governance.yaml#telemetry
# Not:      backup & snapshot policy → see storage.yaml
# Not:      fuel budgets & rate ceilings → see budget.yaml, rate-limits.yaml
# Not:      masking rules → see masking.yaml
# Compiled: yes → capcli.lock root hash
# ───────────────────────────────────────────────────────────────
version: 1

environments:
  dev:
    urp: "env://dev"
    directory: "envs/dev"
    database: "envs/dev/workspace.db"
    audit_db: "envs/dev/audit.db"
    trust_floor: draft
  sim:
    urp: "env://sim"
    directory: "envs/sim"
    database: "envs/sim/workspace.db"
    audit_db: "envs/sim/audit.db"
    trust_floor: reviewed
    seed_masking: strict
  prod:
    urp: "env://prod"
    directory: "envs/prod"
    database: "envs/prod/workspace.db"
    audit_db: "envs/prod/audit.db"
    trust_floor: pinned
    destructive_operations: cryptographic_challenge

env:
  prod:
    draft_writes: deny                         # unproven code cannot touch prod
    intent: required                           # reads too? no — writes; reads stay free
    confirm_above: { rows: 10 }                # tighter thresholds
    vacuum: deny
    api: { fuel: { per_session_fuel: 500000 } }
    allowed_runtimes: [python, javascript, typescript] # ranked: python 1st, js 2nd, ts 3rd
    serve: { bind: "127.0.0.1" }               # public lives behind a proxy
  sim:
    bulk: { require_pre_count: false }
    api:
      base_url_overrides_from: apis/*.sim.yaml
      mock_fixtures_from: apis/*.mock.yaml
      deny_sim_mode: [prod-only]           # prod-only verbs physically denied in sim
    notify: { route_to: "file://envs/sim/telemetry/notifications.jsonl" } # mock file sink; sinks configured in artifacts/governance.yaml#telemetry
    allowed_runtimes: [python, javascript, typescript]
  dev:
    bulk: { require_pre_count: false }
    allowed_runtimes: [python, javascript, typescript] # permissive exploration
    confirm_above: { rows: 1000 }              # looser: dev is cheap
    trust_overlay:                               # draft relaxation for onboarding seeding
      draft:
        max_rows_affected: 100                   # 10× looser than prod draft (10)
        max_insert_per_statement: 200            # seed-sized inserts allowed
        # UPDATE/DELETE still require a bounded WHERE — physics unchanged
        # prod draft stays at 10. this overlay is dev-only.
