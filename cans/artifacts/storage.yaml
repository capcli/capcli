# ───────────────────────────────────────────────────────────────
# storage.yaml — blob storage, WORM backup & storage bounds SSOT
# Owns:     blob storage endpoints (storage://*), WORM backup retention, blob storage bounds, backup policy
# Not:      telemetry event egress sinks → see artifacts/governance.yaml#telemetry
# Not:      audit cold mirror & storage hierarchy → see cans/effect.md#Storage-hierarchy
# Compiled: yes → capcli.lock root hash
# ───────────────────────────────────────────────────────────────
version: 1

# ───────────────────────────────────────────────────────────────
# 1. BLOB STORAGE & WORM BACKUP (Item 14)
# ───────────────────────────────────────────────────────────────
storage:
  primary:
    urp: "storage://blobs"
    backend: object_storage              # local | s3 | r2
    endpoint: "https://storage.endpoint.local"
    bucket: "capcli-data-blobs"
    region: "us-east-1"
    credentials: "vault://storage/primary"
    max_payload_bytes: 10485760          # 10MB
  backup:
    urp: "storage://backup"
    backend: object_storage
    bucket: "capcli-cold-ledger"
    worm_lock:
      enabled: true
      retention_days: 90
      compliance_mode: strict
    kms_attestation:
      key_ref: "vault://kms/attestation_key"
      witness_log: "witness.log"
      signature_interval_minutes: 60

# ───────────────────────────────────────────────────────────────
# 2. EGRESS SINKS
# ───────────────────────────────────────────────────────────────
# Kernel event egress is declared only at artifacts/governance.yaml#telemetry,
# as plain per-env endpoints with explicit drivers
# (e.g. file://envs/<env>/telemetry/<name>.jsonl); resource-pointer URIs
# are not sinks. This file declares no sinks.
sinks: see artifacts/governance.yaml#telemetry
