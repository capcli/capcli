# ═══════════════════════════════════════════════════════════════
# packs.yaml — blueprint manifest schema SSOT
# Pointers: pack://routine/*, pack://world/*
# ═══════════════════════════════════════════════════════════════
version: 1
kind: routine                            # routine | world
urp: "pack://routine/atomic_action"
min_kernel_version: "1.0.0"
policy_version: 5
bundle_hash: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

inputs:
  name:
    type: string
    description: "Unique capability identifier"
    pattern: "^[a-z0-9_]{3,32}$"
  idempotent:
    type: boolean
    default: true

provides:
  files:
    - path: "routines/{inputs.name}.py"
      ast_rewrite: true
      shape_check:
        max_tokens: 2000
        max_complexity: 10
        max_params: 8
