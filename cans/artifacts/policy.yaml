# ═══════════════════════════════════════════════════════════════
# policy.yaml — default-deny behavioral policy, compiled at boot
# Update v4.1: Added identity.skill_origin section (2026-09-12)
# Behavioral permission: what capabilities may do.
# Structure lives in governance.yaml. Zero overlap.
# Two enforcement layers: authorizer (C-level floor) + AST (semantic ceiling)
# ═══════════════════════════════════════════════════════════════
version: 5
lockfile: capcli.lock                 # compiled root hash SSOT
default: deny                         # THE anchor. everything below carves exceptions

# ───────────────────────────────────────────────────────────────
# 1. LAYER 1 — compiled to sqlite3_set_authorizer
#    granularity: action × table × column. engine-enforced.
# ───────────────────────────────────────────────────────────────
authorizer:
  tables:
    # System tables (11 kernel-managed surfaces)
    _audit:
      allow: [read]
    _api_quota:
      allow: [read]
    _api_catalog:
      allow: [read]
    _budget_frames:
      allow: [read]
    secrets:
      allow: [read]
      mask_columns: [value]
      deny_for_trust: [draft]
    agents:
      allow: [read]
    claims:
      allow: [read, insert, delete]
    _pending_asks:
      allow: [read]
    _watch_cursors:
      allow: [read]
    _capability_embeddings:
      allow: [read]
    routine_stats:
      allow: [read]
    _system_schema:
      allow: [read]
      deny: [insert, update, delete]

  views:
    pending_orders:
      allow: [read]
      exposes: [orders, customers]
    my_orders:
      allow: [read]
      exposes: [orders]
      scoped: principal
    customer_lifetime_value:
      allow: [read]
      exposes: [orders, payments, customers]
      scoped: principal

  global:
    attach: deny                               # no side-databases, ever
    detach: deny
    drop: deny
    vacuum: require_trust: pinned              # maintenance only
    alter: require_trust: reviewed             # schema ops gated by trust
    pragma: [query_only, foreign_keys]         # whitelist, never blacklist
    functions:
      allow: [count, sum, min, max, avg, json_extract, date, strftime]
      deny: [load_extension, writefile, readfile, fts3_tokenizer]
    triggers: deny_agent
    # kernel-compiled triggers from schema.yaml trig: are exempt
    # authorizer checks caller: kernel schema-apply bypasses, agent SQL does not

# ───────────────────────────────────────────────────────────────
# 2. LAYER 2 — AST rules, evaluated before prepare
#    granularity: statement shape, blast radius, values, intent
# ───────────────────────────────────────────────────────────────
query:
  multi_statement: deny
  unparseable: deny                            # parser failure fails CLOSED
  writes_require_intent: true                  # no intent → exit 3, cited in explain
    enforce_target_scope: true                 # AST tables/columns must match declared intent target
    max_unrelated_tables: 0                    # zero writes outside intent boundary

  update_delete:
    require_where: true
    require_limit: true
    max_limit: 1000
    max_rows_affected: 100                     # blast radius cap (trust overlays adjust)
    deny_patterns:
      - "UPDATE * SET * WHERE * OR 1=1"
      - "DELETE FROM * WHERE NOT EXISTS *"
      - "* WHERE 1=1 *"

  insert:
    max_rows_per_statement: 500                # chunked beyond this

  select:
    max_limit: 10000
    deny_without_limit: false                  # warning only; views carry their own caps
    masked_columns_redacted: true

  bulk:
    require_pre_count: true                    # db query --count before mass ops
    require_trust: reviewed
    confirm_above: { rows: 50000 }             # raised: human gate only on massive blast radius

  system_tables:
    deny_write: [_audit, _api_quota, _api_catalog, _budget_frames, secrets, agents, claims, _pending_asks, _watch_cursors, _capability_embeddings, routine_stats, _system_schema]
    deny_read: []                              # reads allowed; writes are kernel-internal

# ───────────────────────────────────────────────────────────────
# 3. TRUST — overlays, inherit downward. one engine, parameterized
# ───────────────────────────────────────────────────────────────
trust:
  draft:
    max_rows_affected: 10
    require_where: true
    audit: full
    can_read: { secrets: false }
  reviewed:
    max_rows_affected: 100
    audit: full
  pinned:
    max_rows_affected: 500
    audit: summary
    may_run_unattended: true                   # schedules in prod

# ───────────────────────────────────────────────────────────────
# 4. RATE & BUDGET — frequency is behavior
# ───────────────────────────────────────────────────────────────
rate:
  writes_per_minute: 60
  capability_calls_per_minute: 300
  template_promotions_per_day: 5               # registry-flooding guard
  denials_alert_threshold: 20                  # sustained denial = agent thrashing, surface it

# ───────────────────────────────────────────────────────────────
# 4.5 BUDGET — behavior on exhaustion (structure lives in governance)
# ───────────────────────────────────────────────────────────────
budget:
  overage_behavior: deny               # behavior: what happens at exhaustion
  partial_result_on_exhaustion: false  # behavior: no half-execution
  budget_frame_audit: true             # behavior: every frame is an audit event
  denial_cites_level: true             # behavior: exit 2 names the frame
  denial_cites_remaining: true         # behavior: shows remaining
  denial_cites_ancestors: true         # behavior: shows parent/session context
  # Structure (cascade, inheritance, scopes) → governance.yaml routine_shape.composition

# ───────────────────────────────────────────────────────────────
# 5. API — external effects gated STRICTER (pre-call only, no rollback)
# ───────────────────────────────────────────────────────────────
api:
  secrets:
    exposure: none                             # injected at egress; never env/context/audit
    grade: memory_encrypted                    # ≥ file-perms required to boot
  retry:
    non_idempotent: never                      # double-spend prevention is physics
    idempotent: { max: 3, backoff: exponential }
    require_key_persisted_before_egress: true
  egress:
    allowlist_from: apis/                      # only imported providers reachable
    deny_public_ips: true                      # no raw IP targets
    dormant_verbs: deny                        # dormant verbs are not callable, period
  sync:
    require_url: true                          # sync must have a source URL
    require_interval: true                     # no one-shot-only syncs
    spec_hash_verified: true                   # compiled catalog must match fetched hash
  activation:
    require_intent: true                       # activation without intent → exit 3
    start_trust: draft                         # every activated verb starts at draft
    require_sim_prove_before_ship: true        # no ship without sim evidence
  sim_mode:
    enforce_prod_only: true              # prod-only verbs denied in sim/dev by authorizer
    mock_fixture_required: true          # mock verbs must have apis/<provider>.mock.yaml
    dry_run_returns_simulated: true      # dry-run verbs return { simulated: true }
    skip_reports_gap: true               # skipped verbs produce manifest gap warning
  prod_first_calls:
    enforce: false                       # killed: un-simulated calls proven via synthetic contracts
    require_contract_proof: true         # OpenAPI schema + dry-run verification replaces human sign-off
  spend:
    per_day_usd: 50
    confirm_above_usd: 100                     # human gate reserved strictly for real budget impact
    per_call_confirm_usd: 25
  rate_limit:                                    # live quota from provider responses
    model: proactive_token_bucket                # client-side bucket is PRIMARY authority
    default_capacity: 60                         # burst ceiling
    refill_rate_per_sec: 1.0                     # steady-state token drip
    pre_call_gate: true                          # fail-closed: tokens < 1 → exit 2 immediately
    header_calibration:                          # reactive headers used ONLY to recalibrate bucket
      reconcile_on_response: true                # sync local bucket down if provider reports lower
      reset_header: "X-RateLimit-Reset"
      remaining_header: "X-RateLimit-Remaining"
    audit:
      record_before_after: true                  # quota_before/quota_after on every api.call event
      denial_cites_remaining: true               # exit 2 message includes remaining + reset_at
    env_scoped: true                             # sim and prod track independently
  external_writes:
    require_intent: true
    require_trust: reviewed
    idempotency_key: kernel_minted
  replay: manual                               # never auto-replayed
  search:
    log_all_queries: true                        # every search is an audit event
    log_dormant_discovery: true                  # agent found a dormant verb → logged
    gap_threshold: 3                             # searched N times, never invoked → gap signal

# ───────────────────────────────────────────────────────────────
# 6. HANDS — behavioral rules per hand (counts live in governance)
# ───────────────────────────────────────────────────────────────
schedule:
  require_trust: reviewed                      # drafts can't give themselves a future
  require_intent: true
  allowed_capabilities: [routines, views]      # no raw SQL on a timer
  prod:
    require_trust: pinned                      # unattended = battle-tested only

watch:
  require_trust: reviewed                      # bound capability floor
  require_intent: true
  webhook:
    require_signature: true                    # unsigned events rejected at the door
    allowed_providers: from_apis               # only imported providers may push
  dispatch:
    timeout_seconds: 30
    retry: { max: 3, backoff: exponential }
    dead_letter: true
    on_exhaustion: alert                       # never silent loss

serve:
  min_trust: pinned                            # the strictest door in the system
  auth_required: true                          # anonymous = nonexistent
  keys_human_issued: true
  writes:
    allow_by_default: false
    confirm_above: { rows: 10 }
    require_idempotency: true
  redact_responses: masked_columns             # secrets.view masks apply to egress too

notify:
  require_intent: true
  quiet_hours:
    timezone: America/New_York
    deny_between: ["22:00", "07:00"]
    except: [ask]                              # urgent asks bypass quiet hours
  ask:
    on_timeout: fail_closed                    # expired = denied, never "assume yes"
    on_delivery_failure: fail_closed
    structured_options_required: true          # no free-text answers

# ───────────────────────────────────────────────────────────────
# 7. IDENTITY — who may act, and how they're proven
# ───────────────────────────────────────────────────────────────
identity:
  process_bound: true                          # OS process UID; --by validated against caller context
  self_declaration: deny                       # ids are kernel-issued, never claimed
  scoped_requires_principal: true              # scoped views/asks refuse without --as
  revoked_agent: deny_all                      # instant, no grace period
  kernel_principals: [capcli-cron, capcli-watch, capcli-serve]   # unattended executors

  skill_origin:                                # harness skill provenance propagation
    allow_propagation: true                    # harness may pass triggering skill name
    max_length: 64                             # matches SKILL.md open standard name spec
    format: "lowercase-hyphens"                # lowercase letters, numbers, hyphens only
    audit_field: triggered_by_skill            # recorded in every leaf event
    deny_patterns: ["*..*", "*/*", "* *"]      # no traversal, no paths, no spaces
    on_invalid: strip_and_warn                 # malformed → drop field, log warning, don't deny
    # Skills cannot grant authority. This is metadata only — trust still comes from principal + agent.

# ───────────────────────────────────────────────────────────────
# 8. ENV OVERLAYS — same engine, parameterized per world
# ───────────────────────────────────────────────────────────────
env:
  prod:
    draft_writes: deny                         # unproven code cannot touch prod
    intent: required                           # reads too? no — writes; reads stay free
    confirm_above: { rows: 10 }                # tighter thresholds
    vacuum: deny
    api: { spend: { per_day_usd: 200 } }
    serve: { bind: "127.0.0.1" }               # public lives behind a proxy
  sim:
    rate: { writes_per_minute: 1000 }          # fast iteration
    bulk: { require_pre_count: false }
    api:
      base_url_overrides_from: apis/*.sim.yaml
      mock_fixtures_from: apis/*.mock.yaml
      deny_sim_mode: [prod-only]           # prod-only verbs physically denied in sim
    notify: { route_to: "#sim-notifications" }
  dev:
    bulk: { require_pre_count: false }
    confirm_above: { rows: 1000 }              # looser: dev is cheap
    trust_overlay:                               # draft relaxation for onboarding seeding
      draft:
        max_rows_affected: 100                   # 10× looser than prod draft (10)
        max_insert_per_statement: 200            # seed-sized inserts allowed
        # UPDATE/DELETE still require WHERE + LIMIT — physics unchanged
        # prod draft stays at 10. this overlay is dev-only.

# ───────────────────────────────────────────────────────────────
# 9. AUDIT — what gets recorded (the effect's spine)
# ───────────────────────────────────────────────────────────────
audit:
  log:
    - event                                  # channel.verb naming
    - env
    - stage                                  # live | test | replay
    - agent
    - session
    - principal
    - caused_by
    - intent
    - intent_chain
    - capability
    - version                                # routine/api config version
    - policy_decision
    - rules_matched
    - rows_affected
    - result_hash
    - duration_ms
    - idempotency_key
    - sim_mode                               # sandbox | mock | dry-run | skip | prod-only | real
    - fixture_used                           # true if mock fixture served
    - http_called                            # false for dry-run and mock
    - triggered_by_skill
  redact:
    columns: [secrets.value]
    params_matching: ["*token*", "*password*", "*secret*"]
    auth_headers: always
  retention_days: 90
  mirror_lag_alert_minutes: 5
  unauditable_write: deny                      # if the audit sink fails, nothing runs

# ───────────────────────────────────────────────────────────────
# 10. FAIL-CLOSED CONTRACT — ambiguity resolves toward denial
# ───────────────────────────────────────────────────────────────
fail_closed:
  no_policy: refuse_boot
  lockfile_mismatch: refuse_boot           # abort if hash(schema+system+policy+gov) != capcli.lock
  system_schema_hash_mismatch: refuse_boot # kernel integrity check
  unparseable_sql: deny
  authorizer_callback_error: deny
  ambiguous_read_write_classification: treat_as_write
  headless_approval: deny
  missing_principal_on_scoped: deny
  secret_exposure_detected: kill_and_alert