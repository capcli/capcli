# ═══════════════════════════════════════════════════════════════
# cicd.yaml — Declarative CI/CD pipeline & gate constraints
# Lockfile-verified; enforces deterministic execution on 100% Free Tier.
# ═══════════════════════════════════════════════════════════════
version: 1
ci_runtime: github_actions

cost_controls:
  tier: free_tier_public
  max_parallel_jobs: 20
  timeout_minutes:
    pr_gate: 10
    deep_test: 20
    release: 30

sla:
  local_inner_loop_seconds: 15
  local_pre_push_seconds: 45
  pr_gate_minutes: 4

trinity:
  paths:
    wireframe: cans/artifacts/wireframe
    prompt: cans/artifacts/prompt
    docs: docs
    triggers: cans/artifacts/prompt/_triggers.json
  token_ceilings:
    l1_trailer: 30
    l2_envelope: 150
    l3_leaf: 500
  chars_per_token: 3.5

dependency_graph:
  compilation_order:
    - packages/pwa
    - docs
    - crates/capcli-types
    - crates/capcli-core
    - crates/capcli-daemon
    - crates/capcli-cli
    - packages/ts
    - packages/py

filters:
  rust:
    - 'crates/**'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
  pwa:
    - 'packages/pwa/**'
  docs:
    - 'docs/**'
  ts:
    - 'packages/ts/**'
  py:
    - 'packages/py/**'
  artifacts:
    - 'artifacts/**'
    - 'cans/**'
    - 'capcli.lock'

matrix:
  deep_test:
    include:
      - os: ubuntu-latest
        tier: tier_1
        sandbox: bwrap
      - os: macos-latest
        tier: tier_2
        sandbox: broker
      - os: windows-latest
        tier: tier_2
        sandbox: broker
  release:
    include:
      - os: ubuntu-latest
        target: x86_64-unknown-linux-musl
        use_zig: true
      - os: ubuntu-latest
        target: aarch64-unknown-linux-musl
        use_zig: true
      - os: macos-latest
        target: x86_64-apple-darwin
        use_zig: false
      - os: macos-latest
        target: aarch64-apple-darwin
        use_zig: false
      - os: windows-latest
        target: x86_64-pc-windows-msvc
        use_zig: false

tools:
  rust: "1.85.0"
  python: "3.11"
  bun: "1.1.0"
  node: "20"
