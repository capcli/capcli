# ═══════════════════════════════════════════════════════════════
# env.yaml — environment namespace partitions SSOT
# Pointers: env://dev, env://sim, env://prod
# ═══════════════════════════════════════════════════════════════
version: 1

environments:
  dev:
    urp: "env://dev"
    directory: "envs/dev"
    database: "envs/dev/workspace.db"
    audit_db: "envs/dev/audit.db"
    trust_floor: draft
  sim:
    urp: "env://sim"
    directory: "envs/sim"
    database: "envs/sim/workspace.db"
    audit_db: "envs/sim/audit.db"
    trust_floor: reviewed
    seed_masking: strict
  prod:
    urp: "env://prod"
    directory: "envs/prod"
    database: "envs/prod/workspace.db"
    audit_db: "envs/prod/audit.db"
    trust_floor: pinned
    destructive_operations: cryptographic_challenge
