<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>capcli · Wireframe Engine</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{mono:['ui-monospace','SFMono-Regular','Menlo','Monaco','Consolas','monospace']},colors:{surface:'#0d1117',panel:'#161b22',panel2:'#1c2330',border:'#30363d',success:'#3fb950',denial:'#f85149',refusal:'#db6d28',crash:'#d29922',panic:'#a371f7',yield:'#e3b341',accent:'#58a6ff',muted:'#8b949e'}}}}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes dash{to{stroke-dashoffset:-20}}
.animate-in{animation:fadeIn .3s ease}
.edge-animated{animation:dash 1.2s linear infinite}
</style>
</head>
<body class="bg-surface text-white font-mono overflow-hidden h-screen">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback,useMemo}=React;

// ─── Data Loader ───────────────────────────────────────────────
const DATA_SOURCES={
  flows:'_flows.json',
  states:'_states.json',
  manifest:'manifest.json'
};

async function loadJSON(path){
  const r=await fetch(path);
  if(!r.ok)throw new Error(`fetch ${path}: ${r.status}`);
  return r.json();
}

// ─── wireframe/v2 component renderers (pure fns, no JSX) ───────
// v2 fixtures are serialized CliEnvelope payloads plus a layout
// archetype. Each renderer maps (context, component) to the shared
// {header, sections} view the panel DOM consumes, computing layout
// procedurally — caret columns, tree glyphs, divider runs — so no
// fixture ever stores ASCII art, indents, or repeated state fields.
// context is the envelope context {env, tier, trust} enriched by the
// dispatcher with {id, audit_op, exit}. Exit derives from the screen
// id's state segment (denial 2, refusal 3, crash 4, panic 5, yield 6,
// success 0); non-zero exit implies state_modified false by law, so
// neither is ever restated in fixture data.
const EXIT_CODE_BY_STATE={success:0,denial:2,refusal:3,crash:4,panic:5,yield:6};
const VERB_BY_EXIT_CODE={2:'FAIL',3:'FATAL',4:'CRASH',5:'PANIC',6:'YIELD'};
const TREE_INDENT_STEP=6;
const DIVIDER_LINE='─'.repeat(76);

function exitCodeFromScreenId(id){
  const segment=String(id||'').split('.')[2];
  return Object.prototype.hasOwnProperty.call(EXIT_CODE_BY_STATE,segment)?EXIT_CODE_BY_STATE[segment]:0;
}

function fixtureExitCode(fixture){
  if(!fixture)return 0;
  if(fixture.$schema==='wireframe/v2')return exitCodeFromScreenId(fixture.id||fixture.screen_id);
  return fixture.state?.exit_code??0;
}

function kvValue(v){
  if(v===null||v===undefined)return '';
  return typeof v==='string'?v:String(v);
}

function appendKvEntries(kv,fields){
  if(!fields)return;
  if(Array.isArray(fields)){
    fields.forEach(e=>{
      if(Array.isArray(e))kv.push({field:String(e[0]),value:kvValue(e[1])});
      else if(e&&typeof e==='object'&&e.field!==undefined)kv.push({field:String(e.field),value:kvValue(e.value)});
    });
  }else if(typeof fields==='object'){
    Object.keys(fields).forEach(k=>kv.push({field:k,value:kvValue(fields[k])}));
  }
}

// The one span highlighter: carets are positioned from the highlight's
// offset/length inside the source — never stored in fixture data.
function spanCaretLine(span){
  if(!span||typeof span!=='object')return null;
  const source=span.source??span.text??span.code;
  if(typeof source!=='string')return null;
  let start=-1,length=0;
  if(typeof span.highlight==='string'&&span.highlight.length>0){
    start=source.indexOf(span.highlight);
    length=span.highlight.length;
  }else if(Number.isFinite(span.start)){
    start=span.start;
    length=Number.isFinite(span.length)?span.length:Math.max(1,(Number.isFinite(span.end)?span.end:span.start+1)-span.start);
  }else if(Number.isFinite(span.column)){
    start=span.column;
    length=Number.isFinite(span.length)?span.length:1;
  }
  if(start<0)return null;
  return ' '.repeat(start)+'^'.repeat(Math.max(1,length));
}

function renderDiagnostic(context,component){
  const c=component||{};
  const exit=context.exit??0;
  const bodyItems=[];
  if(c.rule!==null&&c.rule!==undefined&&c.rule!=='')bodyItems.push({text:`${VERB_BY_EXIT_CODE[exit]||'FAIL'}  ${c.rule}`,indent:2});
  const span=(c.span&&typeof c.span==='object')?c.span:null;
  const sourceText=c.source??span?.source??span?.text??span?.code??null;
  if(typeof sourceText==='string'){
    bodyItems.push({text:sourceText,indent:8});
    const caret=spanCaretLine(span);
    if(caret)bodyItems.push({text:caret,indent:8});
    const detail=span?.detail??c.detail;
    if(detail!==null&&detail!==undefined&&detail!=='')bodyItems.push({text:kvValue(detail),indent:8});
  }else if(span?.detail!==null&&span?.detail!==undefined){
    bodyItems.push({text:kvValue(span.detail),indent:8});
  }
  if(c.culprit!==null&&c.culprit!==undefined&&c.culprit!=='')bodyItems.push({text:kvValue(c.culprit),indent:8});
  if(Array.isArray(c.lines))c.lines.forEach(line=>bodyItems.push({text:kvValue(line),indent:8}));
  const kv=[];
  if(context.audit_op!==null&&context.audit_op!==undefined)kv.push({field:'audit_op',value:kvValue(context.audit_op)});
  kv.push({field:'state_modified',value:'false'});
  if(c.layer!==null&&c.layer!==undefined)kv.push({field:'layer',value:kvValue(c.layer)});
  if(c.measured!==null&&c.measured!==undefined)kv.push({field:'measured',value:kvValue(c.measured)});
  const consumed=new Set(['rule','span','source','detail','culprit','lines','layer','measured','remedy','domain','fields','extra_fields']);
  Object.keys(c).forEach(key=>{
    if(consumed.has(key))return;
    const v=c[key];
    if(v===null||v===undefined||typeof v==='object')return;
    kv.push({field:key,value:kvValue(v)});
  });
  appendKvEntries(kv,c.extra_fields);
  appendKvEntries(kv,c.fields);
  if(c.remedy!==null&&c.remedy!==undefined)kv.push({field:'remedy',value:kvValue(c.remedy)});
  if(c.domain!==null&&c.domain!==undefined)kv.push({field:'domain',value:kvValue(c.domain)});
  const sections=[];
  if(bodyItems.length)sections.push({title:null,items:bodyItems});
  if(kv.length)sections.push({title:null,items:kv});
  return{header:{style:'badge',label:`exit ${exit}`},sections};
}

function renderTree(context,component){
  const c=component||{};
  const rawNodes=Array.isArray(c.nodes)?c.nodes:(Array.isArray(c.children)?c.children:[]);
  const nodes=rawNodes.map(n=>typeof n==='string'?{label:n}:n);
  let labelWidth=0;
  const measure=n=>{
    if(!n||typeof n!=='object')return;
    if(n.label!==null&&n.label!==undefined)labelWidth=Math.max(labelWidth,String(n.label).length);
    const kids=Array.isArray(n.children)?n.children:[];
    kids.forEach(k=>measure(typeof k==='string'?{label:k}:k));
  };
  nodes.forEach(measure);
  const items=[];
  const statusMark=s=>{
    const v=String(s).toLowerCase();
    return(v==='denied'||v==='deny'||v==='error'||v==='failed'||v==='failure'||v==='refused')?'✗':'✓';
  };
  const formatNode=n=>{
    if(typeof n==='string')return n;
    let out='';
    if(n.id!==null&&n.id!==undefined&&n.id!=='')out+=`${n.id}  `;
    if(n.label!==null&&n.label!==undefined)out+=String(n.label).padEnd(labelWidth);
    const tail=[];
    if(n.status!==null&&n.status!==undefined)tail.push(`${n.marker??statusMark(n.status)} [${n.status}]`);
    if(n.duration_ms!==null&&n.duration_ms!==undefined)tail.push(`${n.duration_ms}ms`);
    else if(n.duration!==null&&n.duration!==undefined)tail.push(kvValue(n.duration));
    if(n.exit_code!==null&&n.exit_code!==undefined)tail.push(`exit ${n.exit_code}`);
    else if(n.exit!==null&&n.exit!==undefined)tail.push(`exit ${n.exit}`);
    if(tail.length)out+=(n.label!==null&&n.label!==undefined?'  ':'')+tail.join('  ');
    return out.replace(/\s+$/,'');
  };
  const emit=(node,depth,cells,isLast)=>{
    items.push({text:(isLast?'└── ':'├── ')+formatNode(node),indent:2+TREE_INDENT_STEP*depth});
    const kids=[];
    if(node.detail!==null&&node.detail!==undefined&&node.detail!=='')kids.push({__detail:kvValue(node.detail)});
    if(Array.isArray(node.children))node.children.forEach(k=>kids.push(typeof k==='string'?{label:k}:k));
    // Continuation cells: ancestors at depth >= 1 contribute a cell;
    // the top-level column is already carried by the item indent.
    const childCells=depth===0?cells:[...cells,(isLast?'      ':'│     ')];
    kids.forEach((kid,i)=>{
      const last=i===kids.length-1;
      if(kid.__detail!==null&&kid.__detail!==undefined){
        const prefix=[...cells,(isLast?'':'│     ')].join('');
        items.push({text:prefix+(last?'└── ':'├── ')+kid.__detail,indent:2+TREE_INDENT_STEP*(depth+1)});
      }else{
        emit(kid,depth+1,childCells,last);
      }
    });
  };
  if(c.root&&typeof c.root==='object'){
    const r=c.root;
    let head='';
    if(r.id!==null&&r.id!==undefined&&r.id!=='')head+=`${r.id}  `;
    const typeText=r.type??r.label;
    if(typeText!==null&&typeText!==undefined)head+=String(typeText).padEnd(labelWidth);
    if(r.intent!==null&&r.intent!==undefined&&r.intent!==''){
      const intent=String(r.intent);
      head+=(head?'  ':'')+(intent.startsWith('"')?intent:`"${intent}"`);
    }
    items.push({text:head.replace(/\s+$/,''),indent:2});
  }
  nodes.forEach((n,i)=>emit(n,0,[],i===nodes.length-1));
  const sections=[];
  if(items.length)sections.push({title:c.section_title??null,items});
  const footerItems=[];
  appendKvEntries(footerItems,c.footer);
  if(footerItems.length)sections.push({title:null,items:footerItems});
  const label=c.title??(context.audit_op?`Causal DAG Trace (${context.audit_op})`:'exit 0');
  return{header:{style:'plain',label},sections};
}

function renderReceipt(context,component){
  const c=component||{};
  let groups=Array.isArray(c.groups)?c.groups.filter(g=>g&&typeof g==='object'):[];
  if(!groups.length&&(c.fields||c.title))groups=[{fields:c.fields||{}}];
  const sections=[];
  groups.forEach((g,gi)=>{
    const items=[];
    if(gi>0)items.push({text:DIVIDER_LINE,indent:2});
    appendKvEntries(items,g.fields);
    if(Array.isArray(g.lines))g.lines.forEach(line=>items.push({text:kvValue(line),indent:2}));
    sections.push({title:g.title??null,items});
  });
  if(Array.isArray(c.lines)&&c.lines.length){
    sections.push({title:null,items:c.lines.map(line=>({text:kvValue(line),indent:2}))});
  }
  const label=c.header_label??c.title??`exit ${context.exit??0}`;
  return{header:{style:'badge',label},sections};
}

function renderDocument(context,component){
  const c=component||{};
  const sections=[];
  const metaItems=[];
  appendKvEntries(metaItems,c.meta??c.fields);
  if(metaItems.length)sections.push({title:null,items:metaItems});
  const rawBody=Array.isArray(c.body)?c.body:(typeof c.body==='string'?[c.body]:(Array.isArray(c.lines)?c.lines:[]));
  const bodyLines=[];
  rawBody.forEach(entry=>String(entry).split('\n').forEach(line=>bodyLines.push(line)));
  if(bodyLines.length){
    // Lines consisting solely of ─ are divider runs and pass through
    // verbatim; every other line is body text at the document indent.
    sections.push({title:null,items:bodyLines.map(line=>({text:line,indent:2}))});
  }
  if(Array.isArray(c.footer_lines)&&c.footer_lines.length){
    sections.push({title:null,items:c.footer_lines.map(line=>({text:kvValue(line),indent:2}))});
  }
  const label=c.header_badge??c.title??`exit ${context.exit??0}`;
  return{header:{style:'badge',label},sections};
}

const WIREFRAME_V2_RENDERERS={diagnostic:renderDiagnostic,tree:renderTree,receipt:renderReceipt,document:renderDocument};

// Normalize a wireframe/v2 fixture into the shared view shape. v1
// fixtures pass through untouched, so the canvas stays playable at
// every intermediate migration state.
function normalizeV2Fixture(fixture){
  const id=fixture.id||fixture.screen_id||'';
  const exit=exitCodeFromScreenId(id);
  const context={env:'dev',tier:'tier_1',trust:'draft',...(fixture.context&&typeof fixture.context==='object'?fixture.context:{}),id,audit_op:fixture.audit_op??null,exit};
  const renderer=WIREFRAME_V2_RENDERERS[fixture.archetype];
  const built=renderer?renderer(context,fixture.component||{}):null;
  const header=built?.header||{style:'badge',label:`exit ${exit}`};
  const sections=built?.sections||[];
  const rawTrailer=fixture.trailer||fixture.next_action;
  const trailer=(rawTrailer&&typeof rawTrailer==='object')
    ?{prompt:rawTrailer.prompt??rawTrailer.next_prompt,reason:rawTrailer.reason,serve:rawTrailer.serve}
    :undefined;
  return{
    ...fixture,
    state:{exit_code:exit,env:context.env,tier:context.tier,trust:context.trust,state_modified:exit!==0?false:!!fixture.state_modified,domain:(fixture.component&&fixture.component.domain)||null,data_shape:null},
    render:{header,sections},
    trailer,
  };
}

// ─── Screen Renderer (JSON shape → styled output) ──────────────
function RenderScreen({fixture}){
  if(!fixture)return null;
  const view=fixture.$schema==='wireframe/v2'?normalizeV2Fixture(fixture):fixture;
  const{state,render,diagnostic,trailer}=view;
  const env=state?.env||'dev';
  const tier=state?.tier||'tier_1';
  const exit=state?.exit_code??0;
  const icon=exit===0?'✓':'✗';
  const exitColors={0:'text-success',2:'text-denial',3:'text-refusal',4:'text-crash',5:'text-panic',6:'text-yield'};
  const headerColor=exitColors[exit]||'text-white';

  return(
    <div className="text-[11px] leading-relaxed whitespace-pre-wrap text-[#c9d1d9] p-4 overflow-y-auto flex-1">
      {/* Header badge */}
      <div className="mb-3">
        <span className="text-muted">[{env}:{tier}]</span>{'  '}
        <span className={headerColor}>{icon}</span>{'  '}
        <span className={headerColor}>{render?.header?.label||`exit ${exit}`}</span>
      </div>

      {/* Sections */}
      {render?.sections?.map((sec,si)=>(
        <div key={si} className="mb-3">
          {sec.title&&<div className="text-muted mb-1">  {sec.title}:</div>}
          {sec.items?.map((item,ii)=>{
            if(item.text!==undefined){
              const indent=item.indent??2;
              return <div key={ii} style={{paddingLeft:`${indent*4}px`}}>{item.text}</div>;
            }
            if(item.field!==undefined){
              return(
                <div key={ii} className="flex gap-2 pl-2">
                  <span className="text-muted min-w-[140px]">{item.field}:</span>
                  <span>{item.value}</span>
                </div>
              );
            }
            return null;
          })}
        </div>
      ))}

      {/* Trailer */}
      {trailer&&trailer.serve!=='blocked'&&(
        <div className="mt-3 pt-2 border-t border-border text-muted">
          trailer: {trailer.prompt} - {trailer.reason}
        </div>
      )}
    </div>
  );
}

// ─── Canvas Background ─────────────────────────────────────────
function CanvasBackground(){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current,ctx=c.getContext('2d');
    let raf,particles=[];
    const resize=()=>{c.width=c.offsetWidth;c.height=c.offsetHeight};
    resize();window.addEventListener('resize',resize);
    for(let i=0;i<40;i++)particles.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5});
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle='rgba(48,54,61,0.4)';ctx.lineWidth=.5;
      const gs=24;
      for(let x=0;x<c.width;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
      for(let y=0;y<c.height;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
      ctx.fillStyle='rgba(88,166,255,0.15)';
      particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
      raf=requestAnimationFrame(draw);
    }
    draw();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  },[]);
  return <canvas ref={ref} className="absolute inset-0 w-full h-full pointer-events-none opacity-60"/>;
}

// ─── Journey Chip ──────────────────────────────────────────────
function JourneyChip({journey,active,onClick}){
  return(
    <button onClick={onClick}
      className={`px-3 py-1.5 rounded-full text-[11px] border transition-all whitespace-nowrap ${active?'border-accent text-accent bg-accent/10 shadow-lg shadow-accent/10':'border-border text-muted hover:border-accent/50 hover:text-white'}`}>
      <span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{background:journey.color}}/>
      {journey.name}
    </button>
  );
}

// ─── Graph Node ────────────────────────────────────────────────
function GraphNode({id,pos,selected,dim,onSelect,onDrag,stateColor}){
  const parts=id.split('.');
  const noun=parts[0],verb=parts[1],state=parts[2],condition=parts[3];
  return(
    <g transform={`translate(${pos.x},${pos.y})`}
       className={`cursor-grab active:cursor-grabbing transition-opacity ${dim?'opacity-10':''} ${selected?'drop-shadow-[0_0_8px_rgba(88,166,255,0.4)]':''}`}
       onMouseDown={e=>onDrag(e,id)}
       onClick={()=>onSelect(id)}>
      <rect width="210" height="52" rx="10" fill="#161b22"
        stroke={selected?'#fff':stateColor} strokeWidth={selected?2.5:1.5}/>
      <rect width="4" height="52" rx="2" fill={stateColor}/>
      <text x="14" y="22" fill="#e6edf3" fontSize="11" fontWeight="600" fontFamily="inherit">{noun}.{verb}</text>
      <text x="14" y="38" fill="#8b949e" fontSize="9" fontFamily="inherit">{state}.{condition}</text>
      {selected&&<rect width="210" height="52" rx="10" fill="none" stroke="#fff" strokeWidth="1" opacity=".3"/>}
    </g>
  );
}

// ─── Graph Edge ────────────────────────────────────────────────
function GraphEdge({from,to,type,dim,highlighted}){
  const mx=(from.x+210+to.x)/2;
  const d=`M ${from.x+210} ${from.y+26} C ${mx} ${from.y+26}, ${mx} ${to.y+26}, ${to.x} ${to.y+26}`;
  const colors={progress:'#58a6ff',denial:'#f85149',success:'#3fb950',yield:'#e3b341'};
  const dash=type==='denial'?'6 4':type==='yield'?'8 5':'none';
  return(
    <path d={d} fill="none"
      stroke={highlighted?'#fff':colors[type]||'#484f58'}
      strokeWidth={highlighted?2.5:1.4}
      strokeDasharray={dash}
      className={`transition-opacity ${dim?'opacity-5':'opacity-70'} ${highlighted?'edge-animated':''}`}
      markerEnd="url(#arrowhead)"/>
  );
}

// ─── Terminal Panel (renders from JSON shape) ──────────────────
function TerminalPanel({screenId,visible,onClose}){
  const[fixture,setFixture]=useState(null);
  const[error,setError]=useState(null);
  const[loading,setLoading]=useState(false);

  useEffect(()=>{
    if(!screenId){setFixture(null);return;}
    const parts=screenId.split('.');
    const path=`screens/${parts[0]}/${parts[1]}/${screenId}.json`;
    setLoading(true);setError(null);
    fetch(path)
      .then(r=>{if(!r.ok)throw new Error(`${r.status}`);return r.json()})
      .then(data=>{setFixture(data);setLoading(false)})
      .catch(e=>{setError(`[fixture not found] ${path} (${e.message})`);setFixture(null);setLoading(false)});
  },[screenId]);

  if(!visible)return null;

  const exit=fixtureExitCode(fixture);
  const exitColors={0:'text-success',2:'text-denial',3:'text-refusal',4:'text-crash',5:'text-panic',6:'text-yield'};

  return(
    <div className="w-[380px] max-w-[35vw] h-full bg-panel border-l border-border flex flex-col flex-shrink-0 animate-in">
      <div className="px-4 py-3 border-b border-border flex items-center justify-between gap-2">
        <span className="text-xs font-semibold break-all">{screenId||'—'}</span>
        <div className="flex items-center gap-2">
          {fixture&&<span className={`text-[10px] px-2 py-0.5 rounded-full border ${exitColors[exit]} border-current`}>exit {exit}</span>}
          <button onClick={onClose} className="text-muted hover:text-white text-sm">✕</button>
        </div>
      </div>
      {loading&&<div className="flex-1 flex items-center justify-center text-muted text-[11px] animate-pulse">Loading fixture…</div>}
      {error&&<div className="flex-1 flex items-center justify-center text-denial text-[11px] p-4">{error}</div>}
      {fixture&&<RenderScreen fixture={fixture}/>}
      {!fixture&&!loading&&!error&&<div className="flex-1 flex items-center justify-center text-muted text-[11px]">Select a node to inspect.</div>}
    </div>
  );
}

// ─── Main App ──────────────────────────────────────────────────
function App(){
  const[flows,setFlows]=useState(null);
  const[states,setStates]=useState(null);
  const[manifest,setManifest]=useState(null);
  const[fixtures,setFixtures]=useState(null); // id → fixture json (preloaded for search)
  const[error,setError]=useState(null);
  const[positions,setPositions]=useState(new Map());
  const[selected,setSelected]=useState(null);
  const[activeJourney,setActiveJourney]=useState(null);
  const[search,setSearch]=useState('');
  const[panelVisible,setPanelVisible]=useState(true);
  const[transform,setTransform]=useState({x:0,y:0,k:1});
  const[loading,setLoading]=useState(true);
  const svgRef=useRef(null);
  const containerRef=useRef(null);
  const dragRef=useRef(null);
  const panRef=useRef(null);

  useEffect(()=>{
    Promise.all([loadJSON(DATA_SOURCES.flows),loadJSON(DATA_SOURCES.states),loadJSON(DATA_SOURCES.manifest)])
      .then(([f,s,m])=>{setFlows(f);setStates(s);setManifest(m);setLoading(false)})
      .catch(e=>{setError(e.message);setLoading(false)});
  },[]);

  const nodes=useMemo(()=>{
    if(!flows)return[];
    const ids=new Set();
    flows.transitions.forEach(t=>{t.from.forEach(id=>ids.add(id));t.to.forEach(id=>ids.add(id))});
    Object.values(flows.journeys).forEach(j=>{ids.add(j.entry);ids.add(j.terminal)});
    return[...ids];
  },[flows]);

  useEffect(()=>{
    if(!nodes.length)return;
    const pos=new Map();
    const COLS=5,CW=250,RH=76,OX=60,OY=160;
    const sorted=[...nodes].sort();
    sorted.forEach((id,i)=>pos.set(id,{x:OX+(i%COLS)*CW,y:OY+Math.floor(i/COLS)*RH}));
    setPositions(pos);
  },[nodes]);

  // Preload every node's fixture so the search filter can match command
  // strings and render payloads, not just screen IDs. A failed fetch is
  // non-fatal — that node stays ID-searchable only.
  useEffect(()=>{
    if(!nodes.length)return;
    let cancelled=false;
    Promise.all(nodes.map(id=>{
      const parts=id.split('.');
      const path=`screens/${parts[0]}/${parts[1]}/${id}.json`;
      return fetch(path).then(r=>r.ok?r.json():null)
        .then(f=>[id,f]).catch(()=>[id,null]);
    })).then(pairs=>{
      if(cancelled)return;
      const m=new Map();
      pairs.forEach(([id,f])=>{if(f)m.set(id,f)});
      setFixtures(m);
    });
    return()=>{cancelled=true};
  },[nodes]);

  const stateColor=useCallback((id)=>{
    const s=id.split('.')[2];
    const map={success:'#3fb950',denial:'#f85149',refusal:'#db6d28',crash:'#d29922',panic:'#a371f7',yield:'#e3b341'};
    return map[s]||'#30363d';
  },[]);

  const journeyNodes=useMemo(()=>{
    if(!flows||!activeJourney)return null;
    const j=flows.transitions.filter(t=>t.journeys?.includes(activeJourney));
    const s=new Set();
    j.forEach(t=>{t.from.forEach(id=>s.add(id));t.to.forEach(id=>s.add(id))});
    return s;
  },[flows,activeJourney]);

  // Searchable haystack per node: screen id + command + render payload.
  const searchIndex=useMemo(()=>{
    if(!fixtures)return null;
    const idx=new Map();
    fixtures.forEach((f,id)=>{
      idx.set(id,[id,f.command||'',JSON.stringify(f.render||f.component||{})].join(' ').toLowerCase());
    });
    return idx;
  },[fixtures]);

  const dimmed=useCallback((id)=>{
    if(search){
      const q=search.toLowerCase();
      const hay=searchIndex?searchIndex.get(id):null;
      if(!(hay??id.toLowerCase()).includes(q))return true;
    }
    if(journeyNodes&&!journeyNodes.has(id))return true;
    return false;
  },[search,journeyNodes,searchIndex]);

  // Wheel zoom must be a native non-passive listener: React registers
  // onWheel as passive, so e.preventDefault() inside it triggers the
  // browser's passive-listener intervention and blocks zoom. Attach the
  // handler to the SVG element via ref with {passive:false} instead.
  const handleWheel=useCallback(e=>{
    e.preventDefault();
    setTransform(t=>({...t,k:Math.max(.3,Math.min(3,t.k*(e.deltaY<0?1.08:.92)))}));
  },[]);
  useEffect(()=>{
    const svg=svgRef.current;
    if(!svg)return;
    svg.addEventListener('wheel',handleWheel,{passive:false});
    return()=>svg.removeEventListener('wheel',handleWheel);
  },[handleWheel]);
  const handleMouseDown=useCallback(e=>{
    if(e.target.closest('g[data-node]'))return;
    panRef.current={sx:e.clientX-transform.x,sy:e.clientY-transform.y};
  },[transform]);
  const handleMouseMove=useCallback(e=>{
    const cx=e.clientX,cy=e.clientY;
    const pan=panRef.current;
    if(pan){setTransform(t=>({...t,x:cx-pan.sx,y:cy-pan.sy}));return;}
    if(dragRef.current){
      const{nodeId,offX,offY}=dragRef.current;
      const rect=svgRef.current.getBoundingClientRect();
      const nx=(e.clientX-rect.left-transform.x)/transform.k-offX;
      const ny=(e.clientY-rect.top-transform.y)/transform.k-offY;
      setPositions(p=>{const n=new Map(p);n.set(nodeId,{x:nx,y:ny});return n});
    }
  },[transform]);
  const handleMouseUp=useCallback(()=>{panRef.current=null;dragRef.current=null},[]);
  const handleNodeDrag=useCallback((e,id)=>{
    e.stopPropagation();
    const rect=svgRef.current.getBoundingClientRect();
    const pos=positions.get(id);
    dragRef.current={nodeId:id,offX:(e.clientX-rect.left-transform.x)/transform.k-pos.x,offY:(e.clientY-rect.top-transform.y)/transform.k-pos.y};
  },[positions,transform]);

  const fitView=useCallback(()=>{
    if(!positions.size)return;
    let mx=0,my=0;
    positions.forEach(p=>{mx=Math.max(mx,p.x+210);my=Math.max(my,p.y+52)});
    const w=containerRef.current?.clientWidth||1200,h=containerRef.current?.clientHeight||800;
    const k=Math.max(.3,Math.min(1,(w-80)/mx,(h-80)/my));
    setTransform({x:40,y:40,k});
  },[positions]);
  useEffect(()=>{if(positions.size)fitView()},[positions.size]);

  if(loading)return<div className="h-screen flex items-center justify-center"><span className="text-muted animate-pulse">Loading wireframe data…</span></div>;
  if(error)return<div className="h-screen flex items-center justify-center text-denial">Data load failed: {error}<br/><span className="text-muted text-xs mt-2">Ensure {Object.values(DATA_SOURCES).join(', ')} exist alongside this file.</span></div>;

  const journeys=flows?Object.entries(flows.journeys):[];
  const stateEntries=states?Object.entries(states):[];

  return(
    <div className="flex h-screen overflow-hidden">
      <div ref={containerRef} className="flex-1 relative min-w-0">
        <CanvasBackground/>

        <div className="absolute top-3 left-3 right-3 z-20 flex flex-col gap-2 pointer-events-none">
          <div className="flex gap-2 items-center flex-wrap pointer-events-auto">
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Filter nodes…"
              className="bg-panel/90 border border-border rounded-full px-3 py-1.5 text-[11px] outline-none focus:border-accent min-w-[180px] placeholder:text-muted"/>
            <button onClick={fitView} className="bg-panel/90 border border-border rounded-full px-3 py-1.5 text-[11px] hover:border-accent transition-colors">Fit</button>
            <button onClick={()=>setActiveJourney(null)} className={`bg-panel/90 border rounded-full px-3 py-1.5 text-[11px] transition-colors ${!activeJourney?'border-accent text-accent':'border-border text-muted hover:border-accent/50'}`}>All</button>
            <div className="flex gap-2 bg-panel/85 border border-border rounded-full px-3 py-1.5 ml-auto">
              {stateEntries.map(([code,info])=>(
                <span key={code} className="flex items-center gap-1 text-[9px] text-muted">
                  <span className="w-2 h-2 rounded-full" style={{background:stateColor(`x.x.${info.label}.x`)}}/>
                  {info.label}
                </span>
              ))}
            </div>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1 pointer-events-auto">
            {journeys.map(([key,j])=>(
              <JourneyChip key={key} journey={j} active={activeJourney===key}
                onClick={()=>setActiveJourney(activeJourney===key?null:key)}/>
            ))}
          </div>
        </div>

        <svg ref={svgRef} className="w-full h-full relative z-10"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
          <defs>
            {/* Fixed-size head in graph space (markerUnits=userSpaceOnUse).
              refX=12.5 puts the anchor 1.5u past the tip, so the tip lands
              1.5 user-units before the path end — cleanly outside the node's
              1.5px/2.5px border stroke (nodes paint after edges) instead of
              underneath it. */}
            <marker id="arrowhead" viewBox="0 0 12 12" markerUnits="userSpaceOnUse"
              markerWidth="12" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse">
              <path d="M1 1 L11 6 L1 11 z" fill="#484f58"/>
            </marker>
          </defs>
          <g transform={`translate(${transform.x},${transform.y}) scale(${transform.k})`}>
            {flows?.transitions.map((t,ti)=>
              t.from.map(f=>t.to.map(to=>{
                const fp=positions.get(f),tp=positions.get(to);
                if(!fp||!tp)return null;
                const hl=journeyNodes&&t.journeys?.includes(activeJourney);
                return<GraphEdge key={`${ti}-${f}-${to}`} from={fp} to={tp} type={t.arrow_type}
                  dim={dimmed(f)||dimmed(to)} highlighted={hl}/>;
              }))
            )}
            {nodes.map(id=>{
              const pos=positions.get(id);
              if(!pos)return null;
              return<GraphNode key={id} id={id} pos={pos} selected={selected===id}
                dim={dimmed(id)} onSelect={setSelected} onDrag={handleNodeDrag}
                stateColor={stateColor(id)}/>;
            })}
          </g>
        </svg>

        {activeJourney&&flows?.journeys[activeJourney]&&(
          <div className="absolute bottom-4 left-4 right-4 z-20 bg-panel/95 border border-border rounded-xl p-4 animate-in pointer-events-auto">
            <div className="flex items-center gap-2 mb-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{background:flows.journeys[activeJourney].color}}/>
              <span className="text-xs font-semibold">{flows.journeys[activeJourney].name}</span>
            </div>
            <p className="text-[11px] text-muted leading-relaxed">{flows.journeys[activeJourney].description}</p>
            <div className="flex gap-4 mt-2 text-[10px] text-muted">
              <span>entry: <span className="text-accent">{flows.journeys[activeJourney].entry}</span></span>
              <span>terminal: <span className="text-success">{flows.journeys[activeJourney].terminal}</span></span>
            </div>
          </div>
        )}

        <div className="absolute bottom-3 right-3 z-10 text-[9px] text-muted bg-panel/80 border border-border rounded-lg px-3 py-1.5">
          drag nodes · scroll zoom · click inspect
        </div>
      </div>

      <TerminalPanel screenId={selected} visible={panelVisible} onClose={()=>setPanelVisible(false)}/>

      {!panelVisible&&(
        <button onClick={()=>setPanelVisible(true)}
          className="fixed top-3 right-3 z-30 bg-panel border border-border rounded-full px-3 py-1.5 text-[11px] hover:border-accent">
          Show panel
        </button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
