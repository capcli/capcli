# ═══════════════════════════════════════════════════════════════
# governance.yaml — registry & capability shape governance
# Version-locked with schema.yaml + policy.yaml at boot.
# Compiled by kernel; never runtime-editable; exceptions = git commits.
# ═══════════════════════════════════════════════════════════════
version: 8
lockfile: capcli.lock                 # deterministic compiler target
policy_version: 5

# ───────────────────────────────────────────────────────────────
# 1. REGISTRY — the shelves have dimensions
# ───────────────────────────────────────────────────────────────
registry:
  max_routines: 1000                  # local hybrid ONNX vector index scales registry capacity
  soft_cap: 800                       # sys doctor nags; consolidation urged
  embedded_semantic_index: true       # in-binary ONNX vector similarity enabled
  max_per_agent_draft: 30             # anti-flood per agent identity
  creation_rate: { per_hour: 10 }     # no rapid-fire generation
  search_index:
    max_description_tokens: 60        # keep search surface lean per capability
    require_description: true         # unsearchable = unregistrable

# ───────────────────────────────────────────────────────────────
# 1.2 TOPOLOGY & SWARM — distributed state & compute geometry
# ───────────────────────────────────────────────────────────────
topology:
  default_mode: local                 # local | hub | spoke_thin | spoke_fat | spoke_ephemeral | replica
  allowed_modes: [local, hub, spoke_thin, spoke_fat, spoke_ephemeral, replica]
  transports: [unix_socket, wireguard_mesh, mtls]
  hub:
    max_concurrent_spokes: 256
    idle_timeout_seconds: 60
    busy_timeout_ms: 5000             # SQLite BEGIN IMMEDIATE wait floor
  spoke:
    rpc_pool_size: 16
    connect_timeout_ms: 2000
    keepalive_interval_seconds: 10
  ephemeral:
    max_concurrent_nodes: 1000        # auto-scaling dynamic container ceiling
    default_ttl_seconds: 300          # dead worker reap window
    heartbeat_interval_seconds: 5
    missed_heartbeats_to_reap: 3
    force_sync_audit_ack: true        # no exit 0 without central audit receipt
    memory_buffer_mb: 16              # RAM audit buffer before network flush

# ───────────────────────────────────────────────────────────────
# 1.5 TEMPLATES — blueprints are unproven proposals
# ───────────────────────────────────────────────────────────────
template:
  max_templates: 100                  # registry capacity ceiling for blueprints
  max_bundle_size_mb: 5               # bundle transfer ceiling
  registry_repo: "capcli/registry"    # PR-driven marketplace SSOT repo
  registry_index_url: "https://raw.githubusercontent.com/capcli/registry/main/index.json"
  allow_unpinned_urls: false          # bans raw branch URLs (@main); requires releases + sha256
  require_kernel_compat: true         # refuses outdated templates at boot
  require_policy_match: true          # template policy_version == runtime policy_version
  world:
    mandatory_files: ["schema.yaml"]
    max_seed_rows_per_table: 50       # prevent bulk data injection via template
  routine:
    ast_rewrite_name: true            # AST-level routine naming; string-replace banned
    enforce_shape_on_intake: true     # fails intake if template violates routine_shape

# ───────────────────────────────────────────────────────────────
# 2. ROUTINE SHAPE — defaults every file must satisfy
# ───────────────────────────────────────────────────────────────
routine_shape:
  loc:        { max: 150 }               # split big routines
  tokens:     { max: 2000 }              # file size ceiling (context cost)
  params:     { max: 8 }                  # interface bloat guard
  description:{ min_words: 5 }            # searchable or it doesn't ship
  imports:    { max_routine_imports: 3 }  # composition depth hygiene
  
  # ─── GUEST RUNTIMES ──────────────────────────────────────────
  runtime:
    default: python                       # 1st-class guest engine
    priority: [python, javascript, typescript] # explicit priority ranking
    allowed: [python, javascript, typescript]  # system-wide whitelist
    providers:
      python:
        engine: python3
        min_version: "3.11"
        ext: [".py"]
      javascript:
        engine: node                      # node | bun
        min_version: "20.0.0"
        ext: [".js"]
      typescript:
        engine: bun                       # bun | node
        min_version: "1.1.0"
        ext: [".ts"]

  execution:
    max_ops_per_run: 50               # primitive DAG ceiling — op 51 aborts
    max_duration_seconds: 300         # sandbox watchdog kill
    max_result_tokens: 500            # summary cap crossing to the model
    enforce_pagination_contract: true # bans raw JSON string chopping; requires { items, next_cursor } schema
    max_txn_statements: 10            # one transaction stays one thought
    session_ops_ceiling: 500          # session-level hard cap; frames cascade within this

  # Proactive Brokerage
  priority_classes: [critical, standard, background]
  preemption_enabled: true
  yield_enabled: true
  yield_max_deferments: 5
  max_in_flight_poll_seconds: 30       # async 2-step media/container polling duration cap
  max_suspended_tasks: 100             # daemon queue capacity for yielded frames
  sandbox:
    provider: auto                    # auto | bwrap | podman | microvm | wasm
    scratch_mb: 64                    # tmpfs ceiling
    allow_unconfined: false           # cooperative host process execution is strictly prohibited
    tiers:
      tier_1: [linux, wsl2]           # see: cans/physics.md#Platform-tier-taxonomy
      tier_2: [darwin, termux, win]   # see: cans/physics.md#Platform-tier-taxonomy
    pinned_requires_tier_1: true      # see: cans/trust.md#Ladder-laws
  composition:
    budget_inheritance: min            # child effective = min(declared, parent_remaining)
    ops_cascade: true                  # child ops consume from parent's pool
    duration_cascade: true             # child time consumes from parent's clock
    fuel_scope: session                # fuel is session-level, not per-routine
    rate_scope: session                # rate is session-level, not per-routine
    rows_scope: trust_session          # rows per trust level per session
    result_tokens_scope: routine       # each routine caps its own output independently
    max_nesting_depth: 5               # composition depth hygiene
    budget_exhaustion: deny            # exhausted budget = exit 2, never silent truncation
    cascade: true
    session_scoped: [fuel, egress_bytes, writes_per_minute, capability_calls_per_minute, rows_affected]
    routine_scoped_cascade: [ops, duration_ms]
    routine_scoped_independent: [result_tokens]
  versions:
    max_versions_kept: 25             # provenance graph stays navigable
    max_rollback_depth: 5
  manifest_drift: anomaly             # undeclared primitives trigger governance event

# ───────────────────────────────────────────────────────────────
# 3. MAINTENANCE — subtraction runs on schedule
# ───────────────────────────────────────────────────────────────
maintenance:
  consolidation:
    schedule: "0 3 * * 0"             # Sunday 03:00
    max_session_minutes: 30           # consolidation labor is budgeted too
    max_proposals_per_session: 10     # human review stays human-sized
    duplicate_similarity: 0.85        # deterministic SQL/param similarity
    fingerprint_similarity: 0.90      # identical primitive sequences = merge candidates
    merge_requires_human: false       # autonomous merge when regression test suite passes 100%
    auto_retire_dead: false           # propose, never auto-destroy
  discovery:
    passive_mining_floor_events: 20   # background suggestion trigger only; never blocks direct authoring
    min_sequence_occurrences: 2       # n-gram threshold for consolidation proposals
    max_exploratory_ops: 200          # session budget reserved for raw ad-hoc exploration
  decay:
    dead_after_days: 30               # unused → retire candidate
    fail_threshold: 0.7               # success rate below → rollback candidate
    stale_sim_after_days: 14          # sim data too old vs prod → re-seed nag
  audits:
    mirror_lag_max_minutes: 5         # JSONL → _audit mirror freshness SLA
    hash_chain_verify: "0 4 * * *"    # daily integrity check

# ───────────────────────────────────────────────────────────────
# 4. SCHEDULE — time is governed like everything else
# ───────────────────────────────────────────────────────────────
schedule:
  max_active: 20
  max_per_agent: 10
  min_interval_minutes: 5             # no sub-5-minute cron (use watch)
  max_catchup_fires: 1                # daemon restart ≠ fire the missed 40
  dead_schedule_disable: true         # bound routine retired → auto-disable loudly

# ───────────────────────────────────────────────────────────────
# 5. STORAGE — blob storage bounds
# ───────────────────────────────────────────────────────────────
storage:
  provider: local                      # local | s3 | r2
  max_upload_bytes: 10485760           # 10MB per object ceiling
  allowed_mime: ["application/pdf", "image/*", "text/*", "application/json"]

# ───────────────────────────────────────────────────────────────
# 6. API — the catalog has dimensions
# ───────────────────────────────────────────────────────────────
api:
  max_providers: 10
  max_verbs_per_provider: 300            # full catalog fits
  require_description: true              # unsearchable = unregistrable
  sync:
    min_interval_hours: 24               # no hourly hammering of provider URLs
    max_catalog_size_mb: 10              # compiled catalog stays lean
    auto_deprecate_removed: true         # upstream removal → deprecated state
  token_refresh:
    auto_refresh: true                   # auto-rotates ephemeral access tokens via vaulted root
    refresh_buffer_seconds: 300          # proactive refresh window before expiration
    max_retries: 3                       # exhaust retries before falling back to human ask
  decay:
    dead_after_days: 30                  # unused verb → retire candidate
  versions:
    max_versions_kept: 10
  search:
    max_results: 20
    fuzzy_threshold: 2                   # Levenshtein distance for fuzzy match
  sim_mode:
    default: sandbox                     # if apis/<provider>.sim.yaml exists
    fallback: dry-run                    # if no sim.yaml and no explicit sim_mode declared
    require_declaration_for_prod_only: true  # prod-only must be explicit, never inferred
  serve_overlay:
    min_trust_for_served_api: pinned     # served endpoints calling APIs need pin

# ───────────────────────────────────────────────────────────────
# 7. WATCH — ears with limits
# ───────────────────────────────────────────────────────────────
watch:
  max_active: 50
  max_per_agent: 15
  webhook:
    max_payload_bytes: 65536
    events_per_minute: 100            # DDoS guard on the mailbox
  poll:
    min_interval_minutes: 5           # no tight-loop polling (in-flight api.poll_until exempt)
    max_poll_watches: 10              # polling costs egress budget
  dead_letter:
    max_age_days: 30
    max_items: 1000                   # FIFO purge past this, loudly

# ───────────────────────────────────────────────────────────────
# 8. SERVE — the counter window is the strictest door
# ───────────────────────────────────────────────────────────────
serve:
  max_endpoints: 10                   # exposure surface stays small
  max_keys: 25
  min_trust: pinned                   # non-negotiable floor
  require_version_pin: true           # serve order_status@12, never a moving target
  allow_writes_default: false         # inbound writes cost explicit opt-in
  bind: "127.0.0.1"                   # internal-first; public lives behind a proxy
  key_rotation_days: 90               # keys expire; re-issue is a human act
  response:
    max_body_bytes: 65536
    max_result_tokens: 500            # inherits routine result cap

# ───────────────────────────────────────────────────────────────
# 9. NOTIFY / ASK — voices don't shout
# ───────────────────────────────────────────────────────────────
notify:
  max_channels: 3
  message_max_tokens: 300             # notifications are summaries, not essays
  ask:
    question_max_tokens: 100
    max_options: 5
    default_timeout_minutes: 60
    max_timeout_minutes: 480

# ───────────────────────────────────────────────────────────────
# 10. ENVIRONMENTS — worlds stay honest
# ───────────────────────────────────────────────────────────────
env:
  max_environments: 5                 # isolated directory namespaces under envs/
  prod_destructive_auth: challenge_signature  # requires out-of-band WebAuthn/SSH signed challenge
  require_backup_push: true           # no world exists unbacked
  sim_seed_masking: enforce           # sensitive columns masked on fork, always

# ───────────────────────────────────────────────────────────────
# 11. BACKUP — recoverability is a structural property
# ───────────────────────────────────────────────────────────────
backup:
  provider: object_storage            # s3 | r2
  snapshot_interval_minutes: 60
  include_audit: true

# ───────────────────────────────────────────────────────────────
# 12. DENIAL UX — limits teach, not just block
# ───────────────────────────────────────────────────────────────
denials:
  cite_measured_value: true           # "file has 342 LOC, max is 150"
  suggest_remediation: true           # "split it, or adjust governance config"
  log_all: true                       # every governance.deny is an audit event
  scope_mismatch_deny: true           # denies intent when AST targets undeclared tables
  budget_denial_cites_level: true     # "routine B (frame_004) exhausted ops: 20/20"
  budget_denial_cites_remaining: true # shows remaining at blocking level
  budget_denial_cites_ancestors: true # shows parent/session remaining for context

# ───────────────────────────────────────────────────────────────
# 13. SCHEMA — two files, two owners, one DDL
# ───────────────────────────────────────────────────────────────
schema:
  world:
    max_tables: 100                     # agent-authored tables
    max_columns_per_table: 30
    max_indexes_per_table: 10
    max_views: 50
    require_description: true           # unsearchable = unregistrable
  system:
    agent_readable: true                # agent can read system-schema.yaml
    agent_writable: false               # file permission denies write
    kernel_upgrade_only: true           # only kernel releases modify it
    require_hash_verify: true           # boot verifies file hash against kernel version